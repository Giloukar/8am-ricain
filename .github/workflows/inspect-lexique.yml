name: Inspect Lexique 4 columns
on:
  push:
    branches: [lexique-inspect]
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[lexique header]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: lexique-inspect}
      - name: Download and inspect
        run: |
          curl -L --fail --retry 3 https://lexique.org/databases/Lexique400/Lexique400.tsv -o /tmp/Lexique400.tsv
          mkdir -p data
          head -n 3 /tmp/Lexique400.tsv > data/lexique400-header-sample.tsv
      - name: Commit sample
        run: |
          git config user.name "Le Salon Corpus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lexique400-header-sample.tsv
          git commit -m "[lexique header] Inspect Lexique 4 columns"
          git push origin HEAD:lexique-inspect
