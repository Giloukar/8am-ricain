name: Build LexiMind production corpus
on:
  push:
    branches: [main]
    paths:
      - scripts/build_advanced_lexicon.py
      - scripts/hydrate_wiktionary_batch.py
      - .github/workflows/leximind-corpus.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select 7000 advanced French lemmas
        run: python scripts/build_advanced_lexicon.py --limit 7000
      - name: Hydrate 4000 definitions from French Wiktionary
        run: python scripts/hydrate_wiktionary_batch.py data/leximind-candidates.json --output data/leximind-production.json --target 4000
      - name: Validate corpus
        run: python scripts/validate_lexicon.py data/leximind-production.json
      - name: Commit reproducible corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leximind-production.json data/leximind-candidates.json
          git diff --cached --quiet || git commit -m "data: publish 4000-word LexiMind corpus [skip ci]"
          git push
