/* Une table en perspective, avec la main du joueur au premier plan. */
.scene-heading,.scene-seats,.scene-rail,.scene-rest,.scene-atmosphere{display:none}
.scene-toggle.active{color:var(--lime);background:#344530;border:1px solid #87996a}
html[data-immersive='on'] .game-layout{padding-top:22px}
html[data-immersive='on'] .scene-surface{position:relative;isolation:isolate;margin-top:4px;padding:0 9px 18px;--scene-tilt:10deg}
html[data-immersive='on'] .scene-atmosphere{display:block;position:absolute;inset:28px -12px 0;z-index:-1;border-radius:40% 40% 30px 30px;background:radial-gradient(ellipse at 50% 0,#809d492b,transparent 65%),linear-gradient(120deg,#18231a,#101c17);box-shadow:0 35px 65px -30px #0009;pointer-events:none}
html[data-immersive='on'] .scene-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -6px 21px;color:#9cae96;font-size:9px;letter-spacing:.5px}
.scene-heading>span:first-child{display:flex;align-items:center;gap:7px;font-size:8px;letter-spacing:1.7px;color:var(--scene-accent)}
.scene-heading i{width:5px;height:5px;border-radius:50%;background:var(--scene-accent);box-shadow:0 0 10px var(--scene-accent)}
html[data-immersive='on'] .scene-seats{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 25px;margin:0 0 3px;position:relative;z-index:1;min-height:30px}
.scene-seat{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10px;color:#a7b49c;position:relative;max-width:130px;min-height:27px}
.scene-seat>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene-seat.current{color:#e8efd1}
.scene-seat-dot{height:7px;width:7px;border:1px solid var(--player-color);border-radius:50%;flex-shrink:0}
.scene-seat.current .scene-seat-dot{background:var(--player-color);box-shadow:0 0 15px #dce6a155}
.scene-mini-hand{position:relative;width:26px;height:21px;display:inline-block;flex-shrink:0;margin-left:3px}
.scene-mini-hand i{position:absolute;left:8px;top:2px;width:13px;height:19px;border:1px solid #b0b799;border-radius:2px;background:repeating-linear-gradient(45deg,#415741 0 2px,#374c34 2px 4px);box-shadow:0 2px 2px #0006}
.scene-mini-hand i:first-child{transform:translateX(-7px) rotate(-17deg)}
.scene-mini-hand i:last-child{transform:translateX(7px) rotate(17deg)}
html[data-immersive='on'] .scene-surface>.felt{transform:perspective(1100px) rotateX(var(--scene-tilt));transform-origin:50% 73%;min-height:315px;border-radius:31% 31% 14% 14% / 14% 14% 9% 9%;padding:33px 28px 40px;border:9px solid #4a4831;outline:1px solid #79725577;background:radial-gradient(ellipse at 50% 27%,#496849,#2b4c35 51%,#203c2b 90%);box-shadow:inset 0 0 0 2px #a4ad6766,inset 0 0 0 5px #183621,inset 0 -20px 45px #091e1e88,0 7px 0 #2c2b20,0 12px 0 #171d16,0 26px 25px -15px #000a;overflow:clip}
html[data-immersive='on'] .scene-surface>.felt:before{border-radius:inherit;background:repeating-linear-gradient(45deg,#ffffff03 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 0,#e9e7a90b,transparent 70%)}
html[data-immersive='on'] .scene-surface>.felt:after{content:'';position:absolute;inset:11px;pointer-events:none;border:1px dashed #bcbd8735;border-radius:inherit}
html[data-immersive='on'] .felt .playing-card{box-shadow:0 3px 0 #bbb297,0 8px 12px #061b1666}
html[data-immersive='on'] .center-piles{gap:45px}
html[data-immersive='on'] .scene-rail{display:flex;position:relative;align-items:center;justify-content:center;height:21px;margin:3px 4% -8px;color:#b7b49288;font-size:6px;letter-spacing:4px;pointer-events:none}
html[data-immersive='on'] .scene-rail>span:not(.scene-rest){position:relative;z-index:2}
html[data-immersive='on'] .hand-panel{position:relative;isolation:isolate;border-radius:24px 24px 65px 65px / 20px 20px 24px 24px;background:radial-gradient(ellipse at 50% 0,#3c52343d,transparent 70%),linear-gradient(180deg,#203125,#17271f);border-color:#64755266;border-top:2px solid #93a37388;box-shadow:inset 0 -8px 10px #0b171b77,0 16px 40px -22px #000b;padding-bottom:27px;overflow:visible}
html[data-immersive='on'] .hand-top{position:relative;z-index:2;margin-bottom:17px}
html[data-immersive='on'] .hand{position:relative;z-index:2;padding:12px 7px 10px;row-gap:23px}
html[data-immersive='on'] .hand>.playing-card{rotate:var(--fan-angle,0deg);translate:0 var(--fan-rise,0px);transform-origin:50% 130%;box-shadow:0 3px 0 #b7ad91,0 10px 12px #08180b88;transition:transform .2s,box-shadow .2s,rotate .2s,translate .2s}
html[data-immersive='on'] .hand>.playing-card.pickable:hover{transform:translateY(-15px);box-shadow:0 15px 17px #0006,0 0 0 2px var(--lime)}
html[data-immersive='on'] .hand>.playing-card.selected{transform:translateY(-19px)!important;rotate:0deg;box-shadow:0 18px 25px #0007,0 0 0 3px var(--lime)}
html[data-immersive='on'] .hand>.playing-card:focus-visible{outline:3px solid #edf8bd;outline-offset:4px;z-index:4}
html[data-immersive='on'] .hand-help{position:relative;z-index:2;padding:0 28px}
html[data-immersive='on'] .scene-rest{display:block;position:absolute;bottom:-31px;width:72px;height:123px;opacity:.6;pointer-events:none;z-index:0;filter:drop-shadow(0 6px 5px #0006)}
.scene-rest svg{width:100%;height:100%}
.scene-rest.left{left:5px;transform:rotate(23deg)}
.scene-rest.right{right:5px;transform:scaleX(-1) rotate(23deg)}
html[data-immersive='on'] .scene-rail .scene-rest{bottom:-29px;width:66px;height:112px;opacity:.75}
html[data-immersive='on'] .scene-rail .scene-rest.left{left:-8px}
html[data-immersive='on'] .scene-rail .scene-rest.right{right:-8px}
html[data-immersive='on'] .action-zone{position:relative;z-index:3;margin:19px 0 20px}

 huit:{name:'8 américain',short:'8 américain',tag:'Un classique qui a du répondant.',desc:'Changez la couleur, renversez le jeu et videz votre main.',category:'cartes',kind:'Dynamique',time:'10–15 min',min:2,max:6,accent:'#b0c9a0',bg:'#395a43',symbol:'8',rules:['But : être le premier à poser toutes ses cartes. Chacun reçoit 7 cartes.','Posez une carte de la même couleur (pique, cœur, carreau ou trèfle) ou de la même valeur que la défausse. Le 8 se pose sur tout et permet de choisir la couleur.','Un as fait piocher 2 cartes au suivant et saute son tour, le 7 saute un tour, le valet inverse le sens (à deux, il saute un tour). Les pénalités ne se cumulent pas.','Vous pouvez piocher une carte. Si elle est jouable, posez-la ou passez ; les autres cartes attendent votre prochain tour.','Avant de passer de 2 cartes à 1, appuyez sur « Carte ! ». Un oubli ajoute 2 cartes. Une main vide gagne immédiatement.']},

 cactus:{name:'Le Cactus',short:'Cactus',tag:'Gardez les bonnes cartes en tête.',desc:'Quatre cartes cachées. Votre mémoire fait la différence.',category:'cartes',kind:'Mémoire',time:'10–15 min',min:2,max:6,accent:'#d1d19d',bg:'#666b3d',symbol:'✳',rules:['But : terminer à 6 points maximum. Pour gagner son annonce, il faut aussi être strictement sous chaque adversaire. Chacun a 4 cartes cachées ; regardez vos 2 cartes du bas au départ.','À votre tour, piochez une carte du paquet ou prenez celle de la défausse. Échangez-la avec une de vos cartes, ou jetez-la si elle vient du paquet.','Variante de cette table : quatre cartes conservées, sans défausse éclair. Une carte piochée au paquet puis jetée donne un pouvoir : 7 ou 8, regardez une carte à vous ; 9 ou 10, regardez une carte adverse ; valet ou dame, échangez à l’aveugle une de vos cartes avec une carte adverse. Vous pouvez ignorer le pouvoir.','As = 1 ; de 2 à 10 = valeur de la carte ; valet et dame = 10 ; tous les rois = 0.','Au début de votre tour, annoncez « Cactus ! » si vous pensez avoir 6 points ou moins. Chaque adversaire joue encore un tour. Au décompte final, l’annonceur perd en cas de dépassement ou si un adversaire a autant ou moins. Parmi les autres, le minimum à 6 ou moins gagne (ex æquo possibles). Si aucun score n’est admissible, personne ne gagne.']},
 president:{name:'Le Président',short:'Président',tag:'Une main pour changer la hiérarchie.',desc:'Montez les enchères et prenez la tête de la table.',category:'cartes',kind:'Stratégie',time:'10–20 min',min:2,max:6,accent:'#c5b7dc',bg:'#534766',symbol:'♛',rules:['Débarrassez-vous de toutes vos cartes. L’ordre croissant est 3, 4, …, 10, valet, dame, roi, as, 2.','Le premier pose une carte ou plusieurs cartes de même valeur. Il faut répondre avec le même nombre de cartes, d’une valeur supérieure, ou passer. Une nouvelle pose réautorise tous les joueurs à répondre.','Lorsque tous les autres joueurs encore en jeu passent, le dernier à avoir posé ouvre un nouveau pli. S’il a terminé, le suivant encore en jeu ouvre.','Variante révolution : un carré peut être posé sur tout. Il vide le pli et inverse entièrement l’ordre des valeurs, jusqu’au prochain carré.','Le premier est Président. À la manche suivante, le dernier lui donne ses 2 meilleures cartes et reçoit ses 2 moins bonnes. À 4 joueurs ou plus, les deux rangs intermédiaires échangent aussi 1 carte (sauf s’ils font partie du premier échange). Les échanges sont automatiques.']},

 vingtetun:{name:'Le Vingt-et-un',short:'Vingt-et-un',tag:'Savoir quand s’arrêter, tout un art.',desc:'Approchez 21 et défiez la banque, sans le dépasser.',category:'cartes',kind:'Prise de risque',time:'10–15 min',min:1,max:6,accent:'#ddca91',bg:'#3f6154',symbol:'21',rules:['Vous commencez avec 1 000 jetons fictifs. Après 15 mains, le plus de jetons gagne. Aucun argent réel.','Misez de 10 à 200 jetons (ou votre solde restant s’il est inférieur à 10). Vous recevez 2 cartes, la banque aussi, dont une cachée.','Les figures valent 10 ; l’as vaut 1 ou 11. Tirez une carte ou restez. Au-delà de 21, vous perdez la mise. Sur vos 2 premières cartes, « Doubler » double la mise et donne exactement une dernière carte. Pas de séparation de paires.','La banque tire sous 17 et reste à 17, même avec un as compté 11. Un blackjack naturel (as + carte de valeur 10) bat un 21 en 3 cartes ou plus.','Victoire : la mise est rendue avec un gain égal. Blackjack naturel : gain de 1,5 fois la mise. Égalité : mise rendue. Les joueurs sans jetons quittent les mains suivantes.']},
 pouilleux:{name:'Le Pouilleux',short:'Pouilleux',tag:'Une dame. Un peu trop de suspense.',desc:'Formez des paires et évitez la dernière dame de pique.',category:'cartes',kind:'Chance & bluff',time:'5–10 min',min:2,max:6,accent:'#dbb2bc',bg:'#734b57',symbol:'♠',rules:['Les 3 dames autres que la dame de pique sont retirées du paquet. Les 49 cartes restantes sont distribuées.','Les paires de même valeur sont défaussées automatiquement, quelle que soit leur couleur. La dame de pique ne peut former aucune paire.','À votre tour, choisissez une carte cachée chez le prochain joueur qui a encore des cartes. Toute nouvelle paire est retirée ; votre main est remélangée.','Une main vide vous met à l’abri. Les autres continuent à jouer. Le dernier joueur avec la dame de pique perd ; tous les autres gagnent.']},
 rummikub:{name:'Le Rummikub',short:'Rummikub',tag:'Chaque tuile trouve sa place.',desc:'Créez des suites, combinez et réinventez la table.',category:'plateau',kind:'Stratégie',time:'15–30 min',min:2,max:4,accent:'#d3c0a0',bg:'#70614b',symbol:'123',rules:['Version classique à 2–4 joueurs, sans chronomètre. 106 tuiles : 2 exemplaires de 1 à 13 dans 4 couleurs et 2 jokers. Chacun commence avec 14 tuiles. Videz votre chevalet.','Une combinaison est un groupe de 3 ou 4 tuiles de même nombre dans des couleurs différentes, ou une suite d’au moins 3 nombres consécutifs de même couleur. Pas de boucle 13 → 1.','Votre première pose doit totaliser au moins 30 points, uniquement avec vos tuiles, en une ou plusieurs combinaisons. Un joker prend la valeur qu’il remplace.','Après votre première pose, vous pouvez recomposer toute la table, y compris déplacer un joker. Toutes les combinaisons doivent être valides à la fin ; aucune tuile qui était déjà sur la table ne peut revenir sur votre chevalet.','Sélectionnez des tuiles, puis « Nouveau groupe » ou « Ajouter ici ». « Défaire le tour » restaure le départ. « Valider le tour » exige au moins une tuile posée. Piocher annule le chantier et termine le tour.','Les couleurs portent aussi des repères : rouge ●, bleu ◆, ambre ▲, noir ■. Si la pioche est épuisée et que tous passent, le plus petit total restant gagne (joker = 30).']}

function arcadeTurn(s){
 s.phase='play';s.feedback='';s.input=[];s.attempts=0;s.pot=0;s.pumps=0;s.burst=false;
 if(EXTRA_IDS.includes(s.id)){extraTurn(s);return;}
 if(s.id==='echo'){s.sequence=Array.from({length:s.stage+2},()=>Math.floor(Math.random()*4));s.phase='watch';}
 if(s.id==='anagrammes'){
  const length=[5,6,7,8,9][s.stage-1],all=WORD_BANK.map((w,i)=>({w,i})).filter(x=>x.w[0].length===length),fresh=all.filter(x=>!s.usedWords.includes(x.i));
  const pick=shuffle(fresh.length?fresh:all)[0];s.usedWords.push(pick.i);s.answer=pick.w[0];s.clue=pick.w[1];s.letters=shuffle([...s.answer]);
  if(s.letters.join('')===s.answer)s.letters.push(s.letters.shift());
 }
}
function createArcade(s){s.stage=1;s.played=0;s.usedWords=[];arcadeTurn(s);return s;}
function arcadeResult(s,message){s.phase='result';s.feedback=message;say(s,player(s).name+' : '+message);}
function arcadeNext(s){s.played++;s.moves++;if(s.played>=s.players.length*5){s.totals=s.players.map(p=>p.score);const top=Math.max(...s.totals);finish(s,s.players.map((p,i)=>i).filter(i=>s.totals[i]===top),'Cinq manches terminées. Meilleur score : '+top+' points.');return;}s.stage=Math.floor(s.played/s.players.length)+1;s.turn=next(s);arcadeTurn(s);}
function normalizeWord(value){return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');}
function playArcade(s,a){
 const p=player(s);
 if(s.phase==='result'&&a.type==='continue'){arcadeNext(s);return true;}
 if(EXTRA_IDS.includes(s.id))return playExtra(s,a);
 if(s.id==='echo'){
  if(s.phase==='watch'&&a.type==='memorized'){s.phase='repeat';s.moves++;return true;}
  if(s.phase!=='repeat'||a.type!=='pad'||!Number.isInteger(a.index)||a.index<0||a.index>3)return false;
  const correct=a.index===s.sequence[s.input.length];s.input.push(a.index);s.moves++;
  if(!correct)arcadeResult(s,'Séquence interrompue. '+(s.input.length-1)+' point(s) gagné(s).');
  else{p.score++;if(s.input.length===s.sequence.length){p.score+=3;arcadeResult(s,'Séquence parfaite ! +'+(s.sequence.length+3)+' points.');}}return true;
 }
 if(s.id==='anagrammes'){
  if(s.phase!=='play')return false;
  if(a.type==='giveup'){arcadeResult(s,'Le mot était '+s.answer+'. Aucun point.');return true;}
  if(a.type!=='word'||typeof a.word!=='string'||a.word.length>40||!normalizeWord(a.word))return false;
  s.attempts++;s.moves++;
  if(normalizeWord(a.word)===s.answer){const points=[5,3,1][s.attempts-1];p.score+=points;arcadeResult(s,s.answer+' ! +'+points+' points.');}
  else if(s.attempts===3)arcadeResult(s,'Le mot était '+s.answer+'. Aucun point.');else{s.feedback='Pas encore… '+(3-s.attempts)+' essai(s) restant(s).';say(s,p.name+' cherche encore.');}return true;
 }
 if(s.id==='ballon'){
  if(s.phase!=='play')return false;
  if(a.type==='bank'&&s.pot>0){p.score+=s.pot;arcadeResult(s,'+'+s.pot+' points mis à l’abri.');return true;}
  if(a.type!=='pump')return false;
  const risk=Math.min(90,10+s.pumps*10);s.moves++;s.pumps++;
  if(Math.random()*100<risk){s.burst=true;s.pot=0;arcadeResult(s,'Pop ! La cagnotte s’envole.');}else{s.pot+=10;say(s,p.name+' gonfle : '+s.pot+' points en jeu.');}return true;
 }return false;
}
function arcadeAI(s){
 if(s.phase==='result')return{type:'continue'};
 if(EXTRA_IDS.includes(s.id))return extraAI(s);
 if(s.id==='echo')return s.phase==='watch'?{type:'memorized'}:{type:'pad',index:Math.random()<.86?s.sequence[s.input.length]:(s.sequence[s.input.length]+1)%4};
 if(s.id==='anagrammes')return Math.random()<.65?{type:'word',word:s.answer}:{type:'giveup'};
 return{type:s.pot>=20&&Math.random()<.65?'bank':'pump'};
}

function codeFeedback(secret,guess){
 let exact=0;const a=[],b=[];for(let i=0;i<3;i++){if(secret[i]===guess[i])exact++;else{a.push(secret[i]);b.push(guess[i]);}}
 let near=0;for(const x of b){const j=a.indexOf(x);if(j!==-1){near++;a.splice(j,1);}}return {exact,near};
}
function golfShot(position,angle,power,course){
 let x=position.x,y=position.y,vx=Math.cos(angle*Math.PI/180)*power*.2,vy=Math.sin(angle*Math.PI/180)*power*.2,sunk=false;
 const path=[[x,y]],radius=7;
 for(let step=0;step<440;step++){
  // Substeps prevent tunnelling through a portal or a small obstacle.
  for(let sub=0;sub<3;sub++){
   x+=vx/3;y+=vy/3;
   if(x<17){x=34-x;vx=Math.abs(vx)*.82;}if(x>643){x=1286-x;vx=-Math.abs(vx)*.82;}
   if(y<17){y=34-y;vy=Math.abs(vy)*.82;}if(y>283){y=566-y;vy=-Math.abs(vy)*.82;}
   for(const rock of course.obstacles){const dx=x-rock.x,dy=y-rock.y,d=Math.hypot(dx,dy),limit=rock.r+radius;if(d<limit){const nx=d?dx/d:1,ny=d?dy/d:0,dot=vx*nx+vy*ny;x=rock.x+nx*(limit+.1);y=rock.y+ny*(limit+.1);if(dot<0){vx=(vx-2*dot*nx)*.85;vy=(vy-2*dot*ny)*.85;}}}
   if(Math.hypot(x-course.hole.x,y-course.hole.y)<15){x=course.hole.x;y=course.hole.y;sunk=true;break;}
  }
  vx*=.98;vy*=.98;if(step%6===0||sunk)path.push([+x.toFixed(2),+y.toFixed(2)]);
  if(sunk||Math.hypot(vx,vy)<.13)break;
 }
 path.push([+x.toFixed(2),+y.toFixed(2)]);return {x:+x.toFixed(2),y:+y.toFixed(2),path,sunk};
}

  const shot=golfShot(s.golfPos,a.angle,a.power,GOLF_COURSES[s.stage-1]);s.golfStroke++;s.moves++;s.golfPos={x:shot.x,y:shot.y};s.golfPath=shot.path;s.golfSunk=shot.sunk;

function networkErrorMessage(error){return ({'browser-incompatible':'Ce navigateur ne permet pas la connexion entre joueurs. Essayez une version récente de Chrome, Firefox, Edge ou Safari.','peer-unavailable':'Salon introuvable. Vérifiez le code et demandez à l’hôte de garder son onglet ouvert.','unavailable-id':'Ce code est déjà utilisé. Revenez en arrière et créez un nouveau salon.','network':'Le service de connexion est injoignable. Vérifiez Internet, puis réessayez.','server-error':'Le service de connexion ne répond pas. Réessayez dans un instant.','socket-error':'La connexion au service a été interrompue. Vérifiez votre accès Internet.','socket-closed':'La connexion au service a été interrompue.','webrtc':'La liaison entre les appareils n’a pas abouti. Essayez un autre réseau, par exemple un partage de connexion.'})[error?.type]||'La connexion n’a pas abouti. Vérifiez Internet et le code du salon, puis réessayez.';}
function beginOnline(role,name,code='',gameId='huit'){
 if(typeof Peer!=='function'||typeof RTCPeerConnection==='undefined'){toast('Le mode en ligne nécessite un navigateur récent prenant en charge WebRTC.');return;}
 if(role==='guest'&&!validRoom(cleanRoom(code))){toast('Entrez les 8 caractères du code, par exemple ABCD-EFGH.');return;}
 netLeave();net.active=true;net.role=role;net.me=role==='host'?0:1;net.name=networkName(name);net.code=role==='host'?randomRoom():cleanRoom(code);net.gameId=GAMES[gameId]?gameId:'huit';net.status='connecting';
 if(role==='guest'){try{const old=JSON.parse(sessionStorage.getItem('table.online.guest')||'null');if(old?.code===net.code&&typeof old.token==='string')net.token=old.token;}catch{}}
 view='lobby';gate=false;busy=false;selection.clear();closeModal(false);renderOnlineLobby();window.scrollTo(0,0);openNetworkPeer();
}
function openNetworkPeer(){
 const n=net;if(!n.active)return;
 try{n.peer?.destroy();}catch{}n.signalOpen=false;
 let p;try{p=new Peer(n.role==='host'?ROOM_PREFIX+n.code:ROOM_PREFIX+'guest-'+randomToken(),{secure:true,debug:0});n.peer=p;}catch(e){netError(networkErrorMessage(e));return;}
 netTimer('open',()=>{if(!n.signalOpen)netError('Le service de connexion ne répond pas. Vérifiez Internet et réessayez.');},16000);
 p.on('open',()=>{if(net!==n||!n.active||n.peer!==p)return;n.signalOpen=true;clearNetTimer('open');n.error='';if(n.role==='guest')connectGuest();else{if(!n.connected)n.status=n.started?'disconnected':'waiting';netUI();}});
 p.on('connection',conn=>{if(net!==n||!n.active||n.role!=='host'){conn.close();return;}attachConnection(conn,true);});
 p.on('disconnected',()=>{if(net!==n||!n.active||n.peer!==p)return;n.signalOpen=false;netTimer('signal',()=>{if(p.disconnected&&!p.destroyed){try{p.reconnect();}catch{}}},2500);});
 p.on('error',error=>{if(net!==n||!n.active||n.peer!==p)return;if(n.connected&&n.conn?.open)return;clearNetTimer('handshake');n.candidate=null;n.error=networkErrorMessage(error);if(n.started||n.token){networkLost();}else netError(n.error);});
 p.on('close',()=>{if(net===n&&n.active&&n.peer===p&&!n.connected)netError('Le salon a perdu sa connexion. Réessayez ou créez un nouveau salon.');});
}
function connectGuest(){
 if(net.role!=='guest'||!net.active||net.connected||net.candidate)return;
 if(!net.signalOpen){if(net.peer?.disconnected&&!net.peer.destroyed){try{net.peer.reconnect();}catch{openNetworkPeer();}}else if(net.peer?.destroyed)openNetworkPeer();return;}
 net.status=net.started?'reconnecting':'connecting';net.error='';let c;try{c=net.peer.connect(ROOM_PREFIX+net.code,{reliable:true,serialization:'json',label:'table-v4'});}catch{networkLost();return;}net.candidate=c;attachConnection(c,false);netUI();
 netTimer('handshake',()=>{if(!net.connected){try{c.close();}catch{}net.candidate=null;if(net.started||net.token)networkLost();else netError('Impossible de relier les appareils. Vérifiez le code ; si nécessaire, essayez un autre réseau ou un partage de connexion.');}},20000);
}
function attachConnection(conn,host){
 const n=net;let admitted=false,helloTimer=null;
 const reject=message=>{netSend({type:'reject',message},conn);setTimeout(()=>{try{conn.close();}catch{}},120);};
 conn.on('open',()=>{if(net!==n||!n.active){conn.close();return;}if(host){helloTimer=setTimeout(()=>{if(!admitted)conn.close();},8000);}else netSend({type:'hello',code:n.code,name:n.name,token:n.token},conn);});
 conn.on('data',data=>{
  if(net!==n||!n.active||!data||typeof data!=='object')return;
  let size;try{size=JSON.stringify(data).length;}catch{return;}if(size>50000)return;
  if(data.protocol!==ONLINE_PROTOCOL){reject('Les deux joueurs doivent ouvrir la même version du fichier.');return;}
  if(host&&!admitted){
   if(data.type!=='hello'||data.code!==n.code)return;
   if(n.token&&data.token!==n.token||n.connected&&n.conn!==conn){reject('Ce salon est déjà occupé par un autre joueur.');return;}
   admitted=true;clearTimeout(helloTimer);n.token=n.token||randomToken();n.otherName=n.otherName||networkName(data.name);n.conn=conn;n.candidate=null;n.connected=true;n.retryCount=0;n.error='';n.status=n.started?'playing':'ready';n.lastSeen=Date.now();
   netSend({type:'welcome',code:n.code,gameId:n.gameId,hostName:n.name,guestName:n.otherName,token:n.token,lastSeq:n.lastSeq},conn);
   if(n.state)publishOnline();else{netSend({type:'lobby',gameId:n.gameId,hostName:n.name,guestName:n.otherName},conn);netUI();}heartbeat();return;
  }
  if(!host&&!admitted){
   if(data.type==='reject'){clearNetTimer('handshake');n.candidate=null;n.status='error';n.error=String(data.message).slice(0,250);netError(n.error);try{conn.close();}catch{}return;}
   if(data.type!=='welcome'||data.code!==n.code||!GAMES[data.gameId]||typeof data.token!=='string')return;
   admitted=true;n.conn=conn;n.candidate=null;n.connected=true;n.status=n.started?'playing':'ready';n.gameId=data.gameId;n.otherName=networkName(data.hostName);n.token=data.token;n.seq=Math.max(n.seq,Number(data.lastSeq)||0);n.pending=0;n.lastSeen=Date.now();n.retryCount=0;n.error='';clearNetTimer('handshake');clearNetTimer('pending');
   try{sessionStorage.setItem('table.online.guest',JSON.stringify({code:n.code,token:n.token,name:n.name,gameId:n.gameId}));}catch{}netUI();heartbeat();return;
  }
  if(n.conn!==conn||!admitted)return;n.lastSeen=Date.now();
  if(data.type==='ping'){netSend({type:'pong'});return;}if(data.type==='pong')return;
  if(data.type==='leave'){n.error=n.role==='guest'?'L’hôte a quitté le salon. Cette partie est terminée.':'Votre ami a quitté le salon. Vous pouvez fermer cette table.';n.connected=false;n.status='closed';n.pending=0;clearNetTimer('dealer');clearNetTimer('retry');netUI();return;}
  if(host){
   if(data.type==='action')handleGuestAction(data);
   else if(data.type==='sync')publishOnline();
   else if(data.type==='pause'&&typeof data.paused==='boolean'){n.paused[1]=data.paused;publishOnline();scheduleOnline();}
   else if(data.type==='replay'&&data.matchId===n.matchId)voteOnlineReplay(1);
  }else{
   if(data.type==='state')acceptOnlineSnapshot(data);
   else if(data.type==='lobby'&&!n.started){n.gameId=GAMES[data.gameId]?data.gameId:n.gameId;n.status='ready';netUI();}
   else if(data.type==='notice'){toast(String(data.message).slice(0,250));}
  }
 });
 conn.on('close',()=>{clearTimeout(helloTimer);if(net!==n||!n.active||n.status==='closed')return;if(n.conn===conn||n.candidate===conn){n.conn=null;n.candidate=null;networkLost();}});
 conn.on('error',()=>{if(net===n&&n.active&&(n.conn===conn||n.candidate===conn)){try{conn.close();}catch{}n.candidate=null;networkLost();}});
}
function heartbeat(){netTimer('heartbeat',()=>{if(!net.connected)return;if(Date.now()-net.lastSeen>22000){const c=net.conn;net.connected=false;try{c?.close();}catch{}networkLost();return;}netSend({type:'ping'});heartbeat();},5000);}
function networkLost(){if(!net.active||net.status==='closed')return;net.connected=false;net.pending=0;clearNetTimer('pending');clearNetTimer('dealer');clearNetTimer('heartbeat');net.status=net.started?'reconnecting':'error';net.error=net.error||(net.role==='host'?'La connexion avec votre ami a été interrompue. La partie attend son retour.':'Connexion interrompue. La partie reprendra après reconnexion.');netUI();if(net.role==='guest'&&(net.started||net.token)&&net.retryCount<5){net.status='reconnecting';const delay=Math.min(12000,1000*2**net.retryCount++);netTimer('retry',()=>{net.candidate=null;if(net.peer?.destroyed)openNetworkPeer();else connectGuest();},delay);}}
function retryOnline(){if(!net.active)return;net.retryCount=0;net.error='';if(net.role==='host'){if(net.peer?.destroyed||!net.peer)openNetworkPeer();else if(net.peer.disconnected){try{net.peer.reconnect();}catch{openNetworkPeer();}}else{net.status=net.started?'disconnected':'waiting';netUI();}}else{if(net.candidate){try{net.candidate.close();}catch{}net.candidate=null;}if(net.peer?.destroyed||!net.peer)openNetworkPeer();else connectGuest();}}
function startOnlineRound(){if(net.role!=='host'||!net.connected)return;const old=net.state;net.state=createGame(net.gameId,{mode:'online',names:[net.name,net.otherName]},old);net.matchId=randomToken();net.replay=[false,false];net.paused=[false,false];net.started=true;net.status='playing';net.revision++;publishOnline({type:'deal'});scheduleOnline();}
function publishOnline(event=null){if(net.role!=='host'||!net.state)return;const common={type:'state',revision:net.revision,ack:net.lastSeq,matchId:net.matchId,paused:[...net.paused],replay:[...net.replay],event};
 netSend({...common,game:projectGame(net.state,1)});acceptOnlineSnapshot({...common,game:projectGame(net.state,0)},true);
}
function acceptOnlineSnapshot(packet,host=false){
 if(!packet.game||packet.game.mode!=='online'||packet.game.id!==net.gameId||!Array.isArray(packet.game.players)||packet.game.players.length!==2||!Number.isSafeInteger(packet.revision)||packet.revision<net.revision)return;
 const scene=packet.event&&packet.revision!==net.viewRevision?sceneCapture(packet.event):null;const first=!net.started||view!=='game',previousPhase=S?.mode==='online'?S.phase:null,oldRevision=net.viewRevision;net.viewRevision=packet.revision;net.revision=packet.revision;net.matchId=packet.matchId;net.paused=Array.isArray(packet.paused)?packet.paused.map(Boolean).slice(0,2):[false,false];net.replay=Array.isArray(packet.replay)?packet.replay.map(Boolean).slice(0,2):[false,false];
 if(net.pending&&packet.ack>=net.pending){net.pending=0;clearNetTimer('pending');}
 net.started=true;net.status='playing';S=packet.game;gate=false;busy=false;view='game';
 if(packet.revision!==oldRevision||first){selection.clear();showSuit=null;}if(first){closeModal(false);window.scrollTo(0,0);}
 renderGame(packet.revision!==oldRevision||first,packet.event?.type==='roll'?S.path:null);
 if(scene)playSceneAction(scene);else if(first||packet.event?.type==='deal')playSceneAction(sceneCapture({type:'deal'}));
 $('announcer').textContent=S.message+' '+turnText()[0];
 if(packet.event?.type==='roll'&&motions()&&!immersive())document.querySelectorAll('#dice .die').forEach((el,i)=>el.animate([{transform:'rotate(-20deg) translateY(-10px)'},{transform:'rotate(20deg) translateY(-5px)'},{transform:'rotate(0)'}],{duration:550,delay:i*70}));
 if(S.phase==='over'&&previousPhase!=='over'){celebrate();document.querySelector('.win-box')?.scrollIntoView({behavior:motions()?'smooth':'auto',block:'start'});}else if(packet.event)sound(packet.event.type==='roll'?'dice':'card');
 if(host)scheduleOnline();
}
function onlineAct(raw){if(!net.active||!net.connected||netPaused()||net.pending)return;const a=sanitizeOnlineAction(net.gameId,raw);if(!a)return;if(net.me!==S.turn&&!(a.type==='nextRound'&&net.me===0&&S.phase==='roundEnd'))return;
 if(net.role==='host'){applyOnlineAction(a,0);return;}
 const seq=++net.seq;net.pending=seq;
 if(!netSend({type:'action',seq,revision:net.revision,matchId:net.matchId,action:a})){net.pending=0;networkLost();return;}
 renderGame(false);netTimer('pending',()=>{if(!net.pending)return;netSend({type:'sync'});netTimer('pending',()=>{if(net.pending){const c=net.conn;try{c?.close();}catch{}networkLost();}},8000);},7000);
}
function handleGuestAction(packet){
 if(!net.state||!net.connected||!Number.isSafeInteger(packet.seq)||packet.seq<1)return;
 if(packet.seq<=net.lastSeq){publishOnline();return;}
 net.lastSeq=packet.seq;
 if(packet.matchId!==net.matchId||packet.revision!==net.revision){netSend({type:'notice',message:'La table vient de changer. Votre affichage a été actualisé.'});publishOnline();return;}
 const a=sanitizeOnlineAction(net.gameId,packet.action);if(!a||netPaused()||net.state.turn!==1||a.type==='nextRound'){netSend({type:'notice',message:'Ce coup n’est pas autorisé à cet instant.'});publishOnline();return;}
 applyOnlineAction(a,1);
}
function applyOnlineAction(a,actor,internal=false){
 if(net.role!=='host'||!net.state||!net.connected||netPaused())return false;
 if(!internal&&(net.state.turn!==actor&&!(a.type==='nextRound'&&actor===0&&net.state.phase==='roundEnd')))return false;
 const previous=clone(net.state);let ok=false;try{ok=act(net.state,a);}catch{ok=false;}
 if(!ok){net.state=previous;const message=a.type==='suggest'?'Aucun coup simple trouvé. Composez votre tour ou piochez.':'Ce coup n’est pas possible. La table a été conservée.';if(actor===0)toast(message);else netSend({type:'notice',message});publishOnline();return false;}
 net.revision++;publishOnline({type:a.type,actor,...(['swap','target','pick'].includes(a.type)&&Number.isInteger(a.index)?{index:a.index}:{}),...(a.type==='target'&&Number.isInteger(a.owner)?{owner:a.owner}:{})});scheduleOnline();return true;
}
function scheduleOnline(){clearNetTimer('dealer');if(net.role==='host'&&net.active&&net.connected&&!netPaused()&&net.state?.phase==='dealer')netTimer('dealer',()=>applyOnlineAction({type:'dealer'},-1,true),prefs.fast?300:850);}
function setOnlinePause(paused){if(!isOnline())return;if(net.role==='host'){net.paused[0]=paused;publishOnline();scheduleOnline();}else{net.paused[1]=paused;netSend({type:'pause',paused});renderGame(false);}}
function voteOnlineReplay(actor=net.me){if(!net.connected||!net.state&&net.role==='host'||S?.phase!=='over')return;if(net.role==='guest'){net.replay[1]=true;netSend({type:'replay',matchId:net.matchId});renderGame(false);return;}net.replay[actor]=true;if(net.replay.every(Boolean))startOnlineRound();else publishOnline();}
function onlineWaitingText(){if(!net.connected)return net.error||'La table attend la reconnexion.';if(netPaused())return 'Partie en pause · '+(net.paused[net.me]?'reprenez quand vous êtes prêt.':net.otherName+' prend une pause.');if(net.pending)return 'Votre coup est en cours de validation…';return net.otherName+' joue. La partie reprend à votre tour.';}

 const lobbyHTML=`<div class="wrap"><header class="topbar">${brand()}<div class="nav-actions">${soundButton()}<button class="btn ghost small" data-action="net-leave">Quitter le salon</button></div></header><main id="main" class="online-lobby"><div class="eyebrow"><span class="live-dot"></span>UNE TABLE, DEUX ÉCRANS</div><h1>${linked?'Votre table est réunie.':isError?'Un instant, la liaison…':host?'Invitez votre partenaire.':'On vous garde une place.'}</h1><p class="online-lobby-intro">${host?'Partagez le code ci-dessous. Votre ami ouvre ce fichier ou le site, puis choisit « En ligne » et « Rejoindre ».':'Le jeu est choisi par l’hôte. Vous retrouverez automatiquement la même table.'}</p><section class="room-panel"><div class="room-game" style="--art-bg:${g.bg}"><div class="setup-art" aria-hidden="true">${art(n.gameId)}</div><div><span class="eyebrow">${host?'VOTRE JEU':'LE JEU DU SALON'}</span><h2>${g.name}</h2><p>2 joueurs · chacun son écran</p></div></div><div class="room-code-label">CODE DU SALON</div><div class="room-code" aria-live="polite">${waiting&&!n.signalOpen?'••••-••••':roomDisplay(n.code)}</div><div class="room-share"><button class="btn secondary small" data-action="net-copy-code" ${waiting&&!n.signalOpen?'disabled':''}>Copier le code</button>${link?'<button class="btn ghost small" data-action="net-copy-link">Copier le lien d’invitation</button>':''}</div><div class="room-seats"><div><span class="room-avatar">${esc((host?n.name:n.otherName||'H')[0].toUpperCase())}</span><strong>${esc(host?n.name:n.otherName||'L’hôte')}</strong><small>${host?'Vous · hôte':linked?'Connecté':'En attente'}</small></div><span class="room-bridge">↔</span><div><span class="room-avatar second ${!linked?'empty':''}">${linked?esc((host?n.otherName:n.name)[0].toUpperCase()):'?'}</span><strong>${esc(host?(n.otherName||'Votre ami'):n.name)}</strong><small>${host?(linked?'Connecté':'Pas encore arrivé'):'Vous · invité'}</small></div></div><div class="room-status ${linked?'good':isError  if(!a.startsWith('net-')&&a!=='online-show'&&!(net.active&&['home','replay','pause'].includes(a)))return;
 event.preventDefault();event.stopImmediatePropagation();

 if(a==='net-copy-link'){const link=inviteLink();if(link)copyOnline(link);return;}
 if(a==='net-start'){startOnlineRound();return;}
 if(a==='net-retry'){retryOnline();return;}
 if(a==='net-back-form'){const id=net.gameId,name=net.name;netLeave();showHome();setup={id,mode:'online',count:2,names:[name]};renderSetup();return;}
 if(a==='replay'){voteOnlineReplay();return;}
 if(a==='net-resume'){setOnlinePause(false);if(modalKind==='netpause')closeModal(false);return;}
 if(a==='pause'){setOnlinePause(true);modal('<div class="eyebrow">PAUSE PARTAGÉE</div><h2>Prenez votre temps.</h2><p class="modal-subtitle">Les coups sont suspendus pour les deux joueurs. Fermez cette fenêtre pour reprendre.</p><button class="btn full" data-action="close-modal">Reprendre la partie</button>','netpause');}

/* Mouvements communs et mise à jour ciblée du DOM. Pas de boucle permanente. */
const MOTION_EASE='cubic-bezier(.2,.75,.25,1)';
const MOTION_SOFT='cubic-bezier(.22,1,.36,1)';
const uiMotions=new Set(),uiTracks=new WeakMap();
let revealObserver=null,ambienceObserver=null,modalMotionVersion=0,gameRenderIdentity='',motionDeadline=0;
const motionClock=()=>typeof performance!=='undefined'?performance.now():Date.now();
function motionOn(){return motions()&&!document.hidden;}
function motionDuration(ms){return Math.round(ms*(prefs.fast?.7:1));}
function motionCompact(){return (window.innerWidth||1200)<650;}
function motionVisible(r,margin=120){const w=window.innerWidth||1440,h=window.innerHeight||1000;return !!r&&r.width>0&&r.height>0&&r.top<h+margin&&r.left<w+margin&&r.top+r.height>-margin&&r.left+r.width>-margin;}
function markMotionEnd(ms){motionDeadline=Math.max(motionDeadline,motionClock()+ms);}
function motionWait(base){return motionOn()?Math.max(base,Math.min(1800,Math.ceil(motionDeadline-motionClock()+30))):base;}
function uiAnimate(el,frames,options={},track='ui',done){
 if(!el||!motionOn()||typeof el.animate!=='function'){done?.(false);return null;}
 let slots=uiTracks.get(el);if(!slots){slots=new Map();uiTracks.set(el,slots);}slots.get(track)?.cancel();
 let a;try{a=el.animate(frames,{duration:motionDuration(280),easing:MOTION_EASE,...options});}catch{done?.(false);return null;}
 const record={el,a,track};uiMotions.add(record);slots.set(track,a);let finished=false;
 const finish=cancelled=>{if(finished)return;finished=true;uiMotions.delete(record);if(slots.get(track)===a)slots.delete(track);done?.(cancelled);};
 a.onfinish=()=>finish(false);a.oncancel=()=>finish(true);return a;
}
function cancelUITrack(el,track='layout'){uiTracks.get(el)?.get(track)?.cancel();}
function clearUIMotion(){for(const {a} of [...uiMotions])a.cancel();uiMotions.clear();motionDeadline=0;}
function trimUIMotion(){for(const {el,a} of [...uiMotions])if(!el.isConnected)a.cancel();}
function motionKey(el){if(el.nodeType!==1)return null;return el.id?'id:'+el.id:el.dataset.motionKey?'region:'+el.dataset.motionKey:el.dataset.flip?'piece:'+el.dataset.flip:el.dataset.action&&el.dataset.id?'action:'+el.dataset.action+':'+el.dataset.id:null;}
function sameNodeKind(a,b){return a.nodeType===b.nodeType&&(a.nodeType!==1||a.nodeName===b.nodeName);}
function compatibleNode(a,b){if(!sameNodeKind(a,b)||motionKey(a)||motionKey(b))return false;if(a.nodeType!==1)return true;return (a.getAttribute('class')||'').split(' ')[0]===(b.getAttribute('class')||'').split(' ')[0];}
function syncMotionNode(el,next){
 if(el.nodeType!==1){if(el.nodeValue!==next.nodeValue)el.nodeValue=next.nodeValue;return;}
 const active=el===document.activeElement,value=active&&'value' in el?el.value:null,keepOpen=el.matches('details.log-panel')&&el.hasAttribute('open');
 const keepReveal=el.getAttribute('data-reveal');
 for(const a of [...el.attributes])if(!next.hasAttribute(a.name)&&!['data-flight-hidden','data-reveal'].includes(a.name)&&!(a.name==='open'&&keepOpen))el.removeAttribute(a.name);
 for(const a of [...next.attributes])if(el.getAttribute(a.name)!==a.value)el.setAttribute(a.name,a.value);
 if(keepReveal&&!next.hasAttribute('data-reveal'))el.setAttribute('data-reveal',keepReveal);
 patchMotionChildren(el,next);
 if(el.tagName==='INPUT'){if(el.type==='checkbox'||el.type==='radio')el.checked=next.hasAttribute('checked');else if(active&&value!==null)el.value=value;else if(el.value!==next.value)el.value=next.value;}
 if(el.tagName==='TEXTAREA'&&active&&value!==null)el.value=value;
}
function patchMotionChildren(parent,next){
 const before=[...parent.childNodes],keyed=new Map(),used=new Set();before.forEach(n=>{const key=motionKey(n);if(key)keyed.set(key,n);});
 let cursor=parent.firstChild;
 for(const fresh of [...next.childNodes]){
  const key=motionKey(fresh);let keep=key?keyed.get(key):before.find(n=>!used.has(n)&&compatibleNode(n,fresh));
  if(keep&&!sameNodeKind(keep,fresh))keep=null;
  if(keep){used.add(keep);if(keep!==cursor)parent.insertBefore(keep,cursor);syncMotionNode(keep,fresh);cursor=keep.nextSibling;}
  else{const created=fresh.cloneNode(true);parent.insertBefore(created,cursor);}
 }
 before.forEach(n=>{if(!used.has(n)&&n.parentNode===parent)n.remove();});
}
function patchMarkup(parent,html){const next=document.createElement('div');next.innerHTML=html;patchMotionChildren(parent,next);trimUIMotion();}
function motionRects(selector='[data-flip]'){
 const result=new Map();document.querySelectorAll(selector).forEach(el=>{const key=el.dataset.flip||motionKey(el);if(!key||result.has(key))return;const r=el.getBoundingClientRect();result.set(key,{el,left:r.left,top:r.top,width:r.width,height:r.height,back:el.classList.contains('back')});});return result;
}
function motionLayout(old,now,{path=null,enter=true}={}){
 const jobs=[];let count=0;
 // Read every geometry and base transform before starting any animation.
 for(const [key,r] of now){
  if(path&&key==='pawn-'+S.movedPlayer||!motionVisible(r))continue;
  const previous=old.get(key),base=window.getComputedStyle?.(r.el)?.transform||'none';
  if(previous&&previous.back!==r.back){jobs.push({el:r.el,frames:[{transform:'perspective(700px) rotateY(88deg)',opacity:.15},{transform:base,opacity:1}],duration:430});continue;}
  if(previous&&previous.width&&r.width){const dx=previous.left-r.left,dy=previous.top-r.top,sx=previous.width/r.width,sy=previous.height/r.height;if(Math.abs(dx)+Math.abs(dy)>2||Math.abs(sx-1)>.015){jobs.push({el:r.el,frames:[{transform:`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy}) ${base==='none'?'':base}`},{transform:base}],duration:380});}}
  else if(enter&&/^(c-|t-|cactus-|dealer-|action:setup:)/.test(key)){jobs.push({el:r.el,frames:[{opacity:0,transform:`translate3d(0,14px,0) scale(.97) ${base==='none'?'':base}`},{opacity:1,transform:base}],duration:300,delay:Math.min(count++*24,180)});}
 }
 for(const job of jobs)uiAnimate(job.el,job.frames,{duration:motionDuration(job.duration),delay:motionDuration(job.delay||0),easing:MOTION_SOFT,fill:'backwards'},'layout');
}

function renderCatalog(){
 const grid=document.getElementById('games-grid');if(!grid)return;
 const old=motionOn()?motionRects('.game-card'):new Map();patchMarkup(grid,gameCardsHTML());
 grid.querySelectorAll('.game-card').forEach(el=>el.dataset.reveal='done');if(motionOn())motionLayout(old,motionRects('.game-card'));observeHomeMotion();

function resetHomeMotion(){revealObserver?.disconnect();ambienceObserver?.disconnect();revealObserver=ambienceObserver=null;}
function observeHomeMotion(){
 if(view!=='home')return;revealObserver?.disconnect();
 const targets=[...document.querySelectorAll('.hero-copy,.hero-art,.section-top,.online-feature,.game-card,.how')];
 if(!motionOn()){targets.forEach(el=>el.removeAttribute('data-reveal'));return;}
 const pending=targets.filter(el=>!el.hasAttribute('data-reveal'));
 if(typeof window.IntersectionObserver==='function'){
  revealObserver=new window.IntersectionObserver(entries=>{entries.forEach(({target:el,isIntersecting})=>{if(!isIntersecting)return;el.dataset.reveal='done';revealObserver?.unobserve(el);uiAnimate(el,[{opacity:0,translate:'0 18px'},{opacity:1,translate:'0 0'}],{duration:motionDuration(510),delay:Number(el.dataset.revealDelay||0),easing:MOTION_SOFT,fill:'backwards'},'reveal');});},{rootMargin:'40px 0px',threshold:.08});
  pending.forEach((el,i)=>{el.dataset.reveal='pending';el.dataset.revealDelay=String((i%3)*45);revealObserver.observe(el);});
  // Re-observe elements still pending after a catalogue filter.
  targets.filter(el=>el.dataset.reveal==='pending'&&!pending.includes(el)).forEach(el=>revealObserver.observe(el));
  if(!ambienceObserver){ambienceObserver=new window.IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>target.classList.toggle('motion-dormant',!isIntersecting)),{rootMargin:'100px'});const hero=document.querySelector('.hero-art');if(hero)ambienceObserver.observe(hero);}
 }else pending.forEach((el,i)=>{el.dataset.reveal='done';if(motionVisible(el.getBoundingClientRect()))uiAnimate(el,[{opacity:0,translate:'0 12px'},{opacity:1,translate:'0 0'}],{duration:motionDuration(450),delay:Math.min(i*30,180),fill:'backwards'},'reveal');});
}
function cancelDialogMotion(){modalMotionVersion++;const dialog=document.getElementById('dialog');cancelUITrack(dialog,'dialog');dialog?.removeAttribute('data-closing');}
function openDialogMotion(wasOpen){cancelDialogMotion();const dialog=document.getElementById('dialog');if(!dialog.open)dialog.showModal();document.documentElement.dataset.dialogOpen='yes';const target=wasOpen?dialog.querySelector('.modal-body'):dialog;uiAnimate(target,[{opacity:0,translate:wasOpen?'0 7px':'0 16px',scale:wasOpen?'1':'.975'},{opacity:1,translate:'0 0',scale:'1'}],{duration:motionDuration(wasOpen?200:300),easing:MOTION_SOFT},wasOpen?'content':'dialog');}
function closeDialogMotion(finish,immediate=false){
 const dialog=document.getElementById('dialog');cancelDialogMotion();
 if(immediate||!motionOn()||!dialog.open){finish();return;}
 const version=modalMotionVersion;dialog.setAttribute('data-closing','');
 uiAnimate(dialog,[{opacity:1,translate:'0 0',scale:'1'},{opacity:0,translate:'0 10px',scale:'.987'}],{duration:motionDuration(150),easing:'cubic-bezier(.4,0,1,1)'},'dialog',cancelled=>{if(!cancelled&&version===modalMotionVersion){dialog.removeAttribute('data-closing');finish();}});
}
function refreshMotionPreferences(){
 document.documentElement.dataset.tabVisible=document.hidden?'no':'yes';
 if(!motionOn()){if(document.getElementById('dialog')?.hasAttribute('data-closing'))closeModal();else cancelDialogMotion();clearUIMotion();clearSceneFX();document.querySelectorAll('[data-reveal="pending"]').forEach(el=>el.dataset.reveal='done');}
 if(view==='home')observeHomeMotion();

const sceneFlights=new Map(),sceneHands=new Map(),sceneHidden=new Map();

function immersive(){return prefs.immersive!==false;}

function clearSceneFX(){
 for(const a of [...sceneAnimations]){try{a.cancel();}catch{}}sceneAnimations.clear();
 for(const fn of [...sceneCleanup])fn();sceneCleanup.clear();
 sceneNodes.forEach(el=>el.remove());sceneNodes.clear();sceneFlights.clear();sceneHands.clear();sceneHidden.clear();
 const layer=document.getElementById('scene-fx');if(layer)layer.replaceChildren();
}
function sceneRetire(el){if(!el)return;for(const a of [...sceneAnimations])if(a.sceneTarget===el||el.contains(a.sceneTarget))a.cancel();sceneRemove(el);}
function sceneHide(el){
 if(!el)return ()=>{};sceneHidden.get(el)?.();cancelUITrack(el,'layout');
 el.setAttribute('data-flight-hidden','');let restored=false;
 const restore=()=>{if(restored)return;restored=true;if(sceneHidden.get(el)===restore){el.removeAttribute('data-flight-hidden');sceneHidden.delete(el);}sceneCleanup.delete(restore);};
 sceneHidden.set(el,restore);sceneCleanup.add(restore);return restore;
}
function sceneFlightRect(key){return sceneRect(sceneFlights.get(key)?.node);}
function retargetSceneFlights(){
 if(!sceneSnapshot||!sceneMotion())return;
 const targets=new Map([...document.querySelectorAll('[data-flip]')].map(el=>[el.dataset.flip,el]));
 const changes=[];
 for(const [key,flight] of sceneFlights){const next=sceneSnapshot.nodes.get(key),el=targets.get(key);if(!next||!el)continue;
  if(el!==flight.target||Math.abs(next.left-flight.to.left)+Math.abs(next.top-flight.to.top)>3||Math.abs(next.width-flight.to.width)>2)changes.push({flight,from:sceneRect(flight.node),next,el});
 }
 for(const {flight,from,next,el} of changes)sceneFlight(flight.html,from,next,{...flight.options,flip:false,delay:0,duration:320,hide:el});
}
function sceneLayer(){let el=document.getElementById('scene-fx');if(!el){el=document.createElement('div');el.id='scene-fx';el.setAttribute('aria-hidden','true');el.setAttribute('inert','');document.body.append(el);}return el;}
function sceneNode(className,html){
 if(!sceneNodes.size){sceneScrollX=window.scrollX||0;sceneScrollY=window.scrollY||0;}
 const limit=prefs.light?18:motionCompact()?30:48;if(sceneNodes.size>=limit)sceneRetire(sceneNodes.values().next().value);
 const el=document.createElement('div');el.className=className;el.innerHTML=html;sceneLayer().append(el);sceneNodes.add(el);return el;
}
function sceneRemove(el){sceneNodes.delete(el);el.remove();}
function sceneAnimate(el,frames,options,done){
 if(!el||!sceneMotion()||typeof el.animate!=='function'){done?.();return null;}
 let animation;try{animation=el.animate(frames,options);}catch{done?.();return null;}
 animation.sceneTarget=el;sceneAnimations.add(animation);markMotionEnd((options.duration||0)+(options.delay||0));let finished=false;
 const finish=()=>{if(finished)return;finished=true;sceneAnimations.delete(animation);done?.();};
 animation.onfinish=finish;animation.oncancel=finish;
 return animation;
}
function sceneRect(el,fallback=null){if(!el)return fallback;const r=el.getBoundingClientRect();if(!r.width||!r.height)return fallback;return {left:r.left,top:r.top,width:r.width,height:r.height};}
function sceneCenter(r){return {x:r.left+r.width/2,y:r.top+r.height/2};}
function sceneAnchor(selector,fallback){return sceneRect(document.querySelector(selector),fallback);}
function sceneCapture(event={type:'deal'},settled=false){
 if(!sceneMotion()||!S)return null;
 const felt=sceneAnchor('.felt',null);if(!felt)return null;
 const nodes=new Map(),hand=new Set(),table=new Set();
 document.querySelectorAll('[data-flip]').forEach(el=>{const key=el.dataset.flip,r=(!settled&&sceneFlightRect(key))||sceneRect(el);if(!r)return;
  nodes.set(key,{...r,html:el.outerHTML,back:el.classList.contains('back')});
  if(el.closest('.hand-panel'))hand.add(key);else if(el.closest('.felt'))table.add(key);
 });
 const actor=Number.isInteger(event.actor)?event.actor:S.turn,me=privateIndex();
 return {id:S.id,type:event.type,actor,me,mine:actor===me,index:event.index,owner:event.owner,nodes,hand,table,felt,
  phase:S.phase,revolution:S.revolution,discardCount:S.discard?.length||0,
  handRect:sceneAnchor('.hand-panel,.cactus-player.own',felt),
  deck:sceneAnchor('.center-piles .pile:first-child .playing-card,.cactus-draw .pile:first-child .playing-card',felt),
  discard:sceneAnchor('.center-piles .pile:nth-child(2) .playing-card,.cactus-draw .pile:nth-child(2) .playing-card,.trick-cards',felt),
  drawn:sceneAnchor('.cactus-draw .pile:nth-child(3) .playing-card',felt),
  pick:sceneAnchor(`[data-gameact='${JSON.stringify({type:'pick',index:event.index})}']`,sceneAnchor('.opponent-hand',felt))};
}
function decorateScene(){
 document.documentElement.dataset.immersive=immersive()?'on':'off';
 if(!sceneMotion())clearSceneFX();
 if(!immersive()||gate||view!=='game')return;

let toastSequence=0;
function toast(message){
 const sequence=++toastSequence;clearTimeout(toastTimer);patchMarkup($('toasts'),`<div class="toast" role="status">${esc(message)}</div>`);const el=$('toasts').firstElementChild;
 uiAnimate(el,[{opacity:0,translate:'0 10px'},{opacity:1,translate:'0 0'}],{duration:motionDuration(240),easing:MOTION_SOFT},'toast');

}
function sound(kind='card'){if(!prefs.sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;const notes=kind==='win'?[523.25,659.25,783.99,1046.5]:kind==='dice'?[170,260,200]:kind==='error'?[160]:[370,520];notes.forEach((freq,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.type=kind==='dice'?'triangle':'sine';osc.frequency.setValueAtTime(freq,now+i*.065);gain.gain.setValueAtTime(0,now+i*.065);gain.gain.linearRampToValueAtTime(.035,now+i*.065+.008);gain.gain.exponentialRampToValueAtTime(.001,now+i*.065+(kind==='win'?.35:.085));osc.start(now+i*.065);osc.stop(now+i*.065+.4);});}catch{}}

function turnText(){if(isOnline()&&S.phase!=='over'&&(!net.connected||netPaused()||net.pending||S.turn!==net.me&&S.phase!=='dealer'&&S.phase!=='roundEnd'))return [net.connected?(netPaused()?'Partie en pause':net.pending?'Un instant…':net.otherName+' joue'):'Connexion interrompue',onlineWaitingText()];if(S.phase==='over')return ['La partie est terminée','Une nouvelle manche ?'];if(gate)return ['À chacun son tour','Les cartes sont masquées.'];if(S.phase==='dealer')return ['La banque joue','Elle tire sous 17 et reste à 17.'];if(S.phase==='roundEnd')return ['Les comptes sont faits','Prêt pour la prochaine main ?'];if(player(S).bot)return [`${player(S).name} joue`,S.message];if(ARCADE_IDS.includes(S.id))return ['À vous de jouer',S.phase==='result'?S.feedback:GAMES[S.id].tag];if(S.id==='cactus'){return ['À vous de jouer',{peek:'Mémorisez vos deux cartes du bas.',draw:S.caller!==null?'Dernier tour : choisissez votre pioche.':'Piochez, ou annoncez Cactus : 6 points maximum, strictement moins que les autres.',swap:'Choisissez la carte à remplacer.',power:S.power==='swap'?(S.swapFirst==null?'Sélectionnez une carte à vous.':'Sélectionnez une carte adverse.'):'Choisissez une carte à regarder.',reveal:'Mémorisez cette carte avant de continuer.'}[S.phase]];}if(S.id==='huit')return ['À vous de jouer',S.phase==='afterdraw'?'Jouez la carte piochée, ou gardez-la et passez.':'Les cartes jouables sont entourées.'];if(S.id==='oie')return ['À vous de lancer',player(S).wait?'Votre pion attend. Validez le tour.':'Il faut atteindre exactement la case 63.'];if(S.id==='president')return ['À vous de jouer',S.trick?'Sélectionnez une combinaison supérieure ou passez.':'Ouvrez avec des cartes de même valeur.'];if(S.id==='menteur')return ['À vous de jouer',S.phase==='challenge'?'Croyez-vous la dernière annonce ?':'Sélectionnez de 1 à 4 cartes. Le bluff est permis.'];if(S.id==='pouilleux')return ['À vous de piocher','Choisissez une carte cachée chez votre voisin.'];if(S.id==='rummikub')return ['À vous de composer','Sélectionnez des tuiles, puis choisissez leur destination.'];return ['À vous de jouer',S.phase==='bet'?'Choisissez votre mise en jetons fictifs.':'Tirez, restez ou doublez la mise.'];}
function logHTML(){return `<details data-motion-key="log" class="log-panel" ><summary>Le fil de la partie</summary><ol>${S.log.slice(0,10).map(t=>`<li>${esc(t)}</li>`).join('')||'<li>Tout commence par une bonne distribution.</li>'}</ol></details>`;}
function winHTML(){let names=S.winners.map(i=>S.players[i].name).join(' & '),title=!S.winners.length?'Manche sans gagnant':S.mode==='solo'?(S.winners.includes(0)?'Bien joué, c’est gagné !':'La revanche vous attend.'):'Bravo, '+names+' !';return `<section class="win-box" aria-label="Résultat de la partie"><div class="trophy" aria-hidden="true">♛</div><h2>${esc(title)}</h2><p>${esc(S.reason)}</p>${S.id==='president'?`<table class="results-table"><thead><tr><th>Rang</th><th>Joueur</th><th>Titre</th></tr></thead><tbody>${S.order.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(S.players[i].name)}</td><td>${k===0?'Président':k===S.order.length-1?'Dernier':k===1?'Vice-président':'Citoyen'}</td></tr>`).join('')}</tbody></table>`:''}${S.totals?`<table class="results-table"><thead><tr><th>Joueur</th><th>${ARCADE_IDS.includes(S.id)?'Score':'Points restants'}</th></tr></thead><tbody>${S.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td class="${S.winners.includes(i)?'positive':''}">${S.totals[i]}</td></tr>`).join('')}</tbody></table>`:''}${S.id==='vingtetun'?roundResultsHTML(false):''}<div class="action-zone"><button class="btn" data-action="replay" ${isOnline()&&(!net.connected||net.replay[net.me])?'disabled':''}>${isOnline()?(net.replay[net.me]?'Revanche demandée ✓':'Demander une revanche'):S.id==='president'?'Manche suivante':'Rejouer'} ${icon('shuffle')}</button><button class="btn ghost" data-action="home">Les autres jeux</button></div></section>`;}
function gateHTML(){return `<div class="gate-screen">${avatar(S.turn)}<div class="eyebrow">PASSEZ L’ÉCRAN À</div><h2>${esc(player(S).name)}</h2><p>Les autres joueurs regardent ailleurs.<br>Votre main apparaîtra quand vous serez prêt.</p><button class="btn" data-action="reveal-hand">Je suis ${esc(player(S).name)} ${icon('eye')}</button><span class="saved-indicator">${icon('shield')} À chacun ses cartes.</span></div>`;}
function gameHTML(){const g=GAMES[S.id],[headline,desc]=turnText();return `<header class="game-header"><div class="wrap"><button class="btn ghost" data-action="home" aria-label="Retour à la collection de jeux">${icon('back')}<span>Les jeux</span></button><div class="game-heading"><h1>${g.name}</h1><p>${S.mode==='online'?'EN LIGNE · 2 JOUEURS':S.mode==='solo'?'TABLE SOLO':'ENTRE AMIS'} · ${ARCADE_IDS.includes(S.id)?'MANCHE '+S.stage+' / 5':S.id==='vingtetun'?'MAIN '+S.round+' / 15':'MANCHE '+S.round}</p></div><div class="game-tools">${sceneToggleHTML()}<button class="icon-btn" data-action="rules" aria-label="Règles du jeu" title="Règles du jeu">${icon('rules')}</button>${soundButton()}<button class="icon-btn pause-btn" data-action="pause" aria-label="Mettre la partie en pause">${icon('pause')}</button><button class="icon-btn" data-action="settings" aria-label="Préférences">${icon('settings')}</button></div></div></header>${onlineBannerHTML()}<main id="main" class="wrap game-layout"><div class="table-column">${S.phase==='over'?winHTML():''}<div data-motion-key="turn" class="turn-banner">${avatar(S.turn)}<div><div class="turn-label" id="turn-label">${esc(headline)} ${player(S).bot&&S.phase!=='over'?'<span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span>':''}</div><div class="turn-desc">${esc(desc)}</div></div><span class="turn-badge">${S.phase==='over'?'Terminé':S.id==='rummikub'?S.deck.length+' tuiles':S.id==='oie'?'Objectif 63':S.id==='cactus'&&S.caller!==null?'Dernier tour':S.id==='vingtetun'?'Jetons fictifs':'À la table'}</span></div>${gate?gateHTML():sceneBoardHTML()}${!gate&&S.phase!=='over'?`<div id="game-actions">${actionsHTML()}</div>`:''}${!gate?handHTML():''}<div class="table-footnote">${isOnline()?'Synchronisation en direct · l’hôte garde son onglet ouvert.':savedOkay?`${iconInlineSave()} Sauvegarde automatique dans ce navigateur.`:'La sauvegarde est indisponible dans ce navigateur. Gardez cet onglet ouvert.'}</div>${logHTML()}</div><aside class="sidebar" aria-label="Joueurs"><div class="sidebar-label">AUTOUR DE LA TABLE · ${S.players.length}</div><div class="players">${playersHTML()}</div><div class="sidebar-tip"><div class="eyebrow">LE PETIT RAPPEL</div><p>${g.rules[0]}</p><button data-action="rules">Toutes les règles ↗</button></div></aside></main>`;}
function iconInlineSave(){return '✓';}
function boardHTML(){if(S.id==='huit')return `<section data-motion-key="felt" class="felt" aria-label="Table du 8 américain"><div class="center-piles"><div class="pile"><div class="stack">${cardHTML(null,{button:canPlay()&&S.phase==='play',attr:attrs({type:'draw'}),label:'Piocher une carte'})}</div><div class="pile-label">PIOCHE · ${S.deck.length}</div></div><div class="pile">${cardHTML(S.discard.at(-1),{key:'c-'+S.discard.at(-1).id})}<div class="pile-label">DÉFAUSSE</div></div></div><div class="suit-chip"><b class="${['H','D'].includes(S.suit)?'red-suit':''}">${SYMBOLS[S.suit]}</b> ${SUIT_NAMES[S.suit]} demandé <span style="margin-left:9px">${S.dir===1?'↻':'↺'}</span></div><span class="felt-mark">LA TABLE DE JEUX</span></section>`;
 if(S.id==='oie')return gooseBoardHTML();if(S.id==='cactus')return cactusBoardHTML();if(S.id==='rummikub')return rummiBoardHTML();if(S.id==='vingtetun')return blackjackBoardHTML();
 if(S.id==='president')return `<section data-motion-key="felt" class="felt" aria-label="Table du Président"><p class="table-text">${S.revolution?'RÉVOLUTION · 2 < A < R < D < V < 10 … < 3':'3 < 4 < 5 < 6 < 7 < 8 < 9 < 10 < V < D < R < A < 2'}</p><div class="trick-cards">${S.trick?S.trick.cards.map(c=>cardHTML(c,{key:'c-'+c.id})).join(''):'<div class="empty-trick">♛</div>'}</div><div class="table-text">${S.trick?`${esc(S.players[S.trick.owner].name)} · ${S.trick.cards.length} carte${S.trick.cards.length>1?'s':''} à battre`:'Un nouveau pli. À vous de donner le ton.'}</div>${S.passed.length?`<div class="table-text">Ont passé : ${S.passed.map(i=>esc(S.players[i].name)).join(', ')}</div>`:''}<span class="felt-mark">LA TABLE DE JEUX</span></section>`;
 if(S.id==='menteur')return `<section data-motion-key="felt" class="felt" aria-label="Table du Menteur"><div class="center-piles"><div class="pile"><div class="stack">${cardHTML(null)}</div><div class="pile-label">LE TAS · ${S.discard.length} CARTE${S.discard.length>1?'S':''}</div></div><div class="claim-info">${S.claim?`${esc(S.players[S.claim.owner].name)} annonce<strong>${S.claim.cards.length} × ${rankName(S.claim.rank)}</strong>Vérité ou joli bluff ?`:`Valeur à annoncer<strong>${rankName(S.required)}</strong>De 1 à 4 cartes, face cachée.`}</div></div>${S.revealed.length?`<div class="table-text">Dernières cartes contestées<div class="reveal-strip">${S.revealed.map(c=>cardHTML(c)).join('')}</div></div>`:''}<span class="felt-mark">LA TABLE DE JEUX</span></section>`;
 const target=next(S,S.turn,k=>pHand(S,k)>0);return `<section data-motion-key="felt" class="felt" aria-label="Table du Pouilleux">${S.phase==='over'?`<p class="table-announcement">La dame a choisi sa compagnie.</p>${cardHTML({rank:12,suit:'S'})}`:`<p class="table-text">PIOCHEZ CHEZ ${esc(S.players[target].name.toLocaleUpperCase('fr'))}</p><div class="opponent-hand">${S.players[target].hand.map((c,i)=>cardHTML(null,{button:canPlay(),attr:attrs({type:'pick',index:i}),classes:'pickable',label:'Piocher la carte cachée '+(i+1),key:'opponent-'+target+'-'+i})).join('')}</div><p class="table-text">${S.discard.length/2} paires déjà écartées. La prochaine sera-t-elle la vôtre ?</p>`}<span class="felt-mark">LA TABLE DE JEUX</span></section>`;
}
function boardCoordinates(){const coords=[];let left=0,right=8,top=0,bottom=6;while(left<=right&&top<=bottom){for(let x=left;x<=right;x++)coords.push([x,top]);top++;for(let y=top;y<=bottom;y++)coords.push([right,y]);right--;if(top<=bottom){for(let x=right;x>=left;x--)coords.push([x,bottom]);bottom--;}if(left<=right){for(let y=bottom;y>=top;y--)coords.push([left,y]);left++;}}return coords;}
const CELL_COORDS=boardCoordinates();
function pawnHTML(i){return `<span class="pawn" data-flip="pawn-${i}" style="--player-color:${COLORS[i]}" title="${esc(S.players[i].name)}" aria-label="Pion de ${esc(S.players[i].name)}">${i+1}</span>`;}
function gooseBoardHTML(){return `<section data-motion-key="felt" class="felt goose-felt" aria-label="Plateau du jeu de l’oie"><div class="goose-controls"><div class="start-tokens">Départ ${S.players.map((p,i)=>p.pos===0?pawnHTML(i):'').join('')}</div><div class="dice-pair" id="dice">${S.dice.map(n=>dieHTML(n,busy)).join('')}</div><span class="table-text">${S.dice[0]+S.dice[1]} points</span></div><div class="goose-board">${CELL_COORDS.map(([x,y],k)=>{const n=k+1,symbol=GEESE.includes(n)?'♧':({6:'⌒',19:'☕',31:'◉',42:'⤴',52:'▥',58:'↶',63:'♛'}[n]||'');return `<div class="goose-cell ${GEESE.includes(n)?'goose':''} ${[6,19,31,42,52].includes(n)?'trap':''} ${n===58?'danger':''} ${n===63?'goal':''}" data-cell="${n}" style="grid-column:${x+1};grid-row:${y+1}" title="Case ${n}${GEESE.includes(n)?' · Oie':SPECIAL[n]?' · '+SPECIAL[n]:''}"><span class="number">${n}</span><span class="cell-symbol" aria-hidden="true">${symbol}</span><div class="tokens">${S.players.map((p,i)=>p.pos===n?pawnHTML(i):'').join('')}</div></div>`;}).join('')}</div><div class="goose-legend"><span>♧ Oie : rejouez le déplacement</span><span>⌒ Pont</span><span>☕ Auberge</span><span>◉ Puits</span><span>⤴ Labyrinthe</span><span>▥ Prison</span><span>↶ Départ</span></div></section>`;}
function cactusVisible(i,j){if(S.phase==='over')return true;if(!canPlay())return false;if(S.phase==='peek')return i===S.turn&&j>=2;if(S.reveal)return S.reveal.owner===i&&S.reveal.index===j;return false;}
function cactusBoardHTML(){return `<section data-motion-key="felt" class="felt cactus-felt" aria-label="Table du Cactus"><div class="cactus-table">${S.players.map((p,i)=>`<div class="cactus-player ${i===privateIndex()?'own':''}"><h3>${esc(p.name)}${S.caller===i?' · Cactus !':''}</h3><div class="cactus-four">${p.hand.map((c,j)=>{const visible=cactusVisible(i,j);let interactive=canPlay()&&((S.phase==='swap'&&i===S.turn)||(S.phase==='power'&&((S.power==='self'&&i===S.turn)||(S.power==='other'&&i!==S.turn)||(S.power==='swap'&&(S.swapFirst==null?i===S.turn:i!==S.turn)))));return cardHTML(visible?c:null,{button:interactive,attr:attrs(S.phase==='swap'?{type:'swap',index:j}:{type:'target',owner:i,index:j}),classes:(interactive?'pickable legal ':'')+(S.swapFirst===j&&i===S.turn?'selected':''),key:'cactus-'+i+'-'+j,label:'Carte '+(j+1)+' de '+p.name});}).join('')}</div>${S.phase==='over'?`<p class="points">${S.totals[i]} <small>POINTS</small></p>`:S.phase==='peek'&&i===S.turn?'<p class="peek-label">Ces deux cartes ne resteront pas visibles.</p>':''}</div>`).join('')}</div>${S.phase!=='over'?`<div class="cactus-draw"><div class="pile">${cardHTML(null,{button:canPlay()&&S.phase==='draw',attr:attrs({type:'draw'}),label:'Piocher au paquet'})}<div class="pile-label">PIOCHE</div></div><div class="pile">${cardHTML(S.discard.at(-1),{button:canPlay()&&S.phase==='draw'&&S.discard.length>0,attr:attrs({type:'take'}),key:S.discard.length?'c-'+S.discard.at(-1).id:undefined})}<div class="pile-label">DÉFAUSSE</div></div>${S.drawn?`<div class="pile">${cardHTML(canPlay()?S.drawn:null,{key:canPlay()?'c-'+S.drawn.id:'drawn-hidden'})}<div class="pile-label">${canPlay()?'VOTRE PIOCHE':'CARTE PIOCHÉE'}</div></div>`:''}</div>`:''}</section>`;}
function rummiBoardHTML(){const mine=canPlay(),oldIds=new Set(S.refTable.flat().map(t=>t.id));return `<section data-motion-key="felt" class="felt rummi-felt" aria-label="Table du Rummikub"><div class="rummi-table-top"><span>LA TABLE COMMUNE</span><span>${S.table.flat().length} tuiles posées</span></div>${S.table.some(g=>g.length)?`<div class="rummi-groups">${S.table.map((g,k)=>{if(!g.length)return '';const v=validMeld(g);return `<div class="meld-zone ${v?'valid':'invalid'}" aria-label="Combinaison ${k+1}${v?' valide':' à compléter'}">${g.map(t=>tileHTML(t,{button:mine&&(player(S).opened||!oldIds.has(t.id)),selected:selection.has(t.id),classes:selection.has(t.id)?'selected':'',attr:`data-action="select-tile" data-id="${t.id}"`,key:'t-'+t.id,jokerAs:t.joker&&v?(v.type==='run'?v.start+v.tiles.findIndex(x=>x.id===t.id):v.joker):null})).join('')}${mine&&(player(S).opened||g.every(t=>!oldIds.has(t.id)))?`<button class="add-here" data-action="rummi-place" data-dest="${k}" aria-label="Ajouter les tuiles à la combinaison ${k+1}" ${!selection.size?'disabled':''}>+</button>`:''}</div>`;}).join('')}</div>`:`<div class="rummi-table-empty"><span style="font:40px var(--serif);color:#e7cf96">✳</span><b>Tout reste à composer.</b><p>Les premières suites et les premiers groupes se posent ici. Votre sortie doit atteindre 30 points.</p></div>`}</section>`;}
function blackjackBoardHTML(){if(S.phase==='bet'){const p=player(S),limit=Math.min(200,p.chips);return `<section data-motion-key="felt" class="felt"><div class="bet-panel"><h2>Faites vos jeux.</h2><p>${esc(p.name)} · ${p.chips.toLocaleString('fr-FR')} jetons disponibles</p><div class="bet-buttons">${[10,25,50,100].map(n=>`<button class="bet-chip" ${attrs({type:'bet',amount:n})} ${!canPlay()||n>limit?'disabled':''} aria-label="Miser ${n} jetons">${n}</button>`).join('')}</div>${canPlay()?`<form class="bet-custom" id="bet-form"><label for="bet-amount" class="sr-only">Montant de la mise</label><input class="text-input" id="bet-amount" type="number" min="${Math.min(10,p.chips)}" max="${limit}" step="any" value="${Math.min(50,limit)}" required><button class="btn small secondary" type="submit">Miser</button></form>`:''}</div><span class="felt-mark">JETONS FICTIFS · PLAISIR RÉEL</span></section>`;}const revealed=S.dealerRevealed||S.phase==='over';return `<section data-motion-key="felt" class="felt" aria-label="Table du Vingt-et-un"><p class="dealer-label">LA BANQUE</p><div class="trick-cards">${S.dealer.map((c,i)=>cardHTML(i===0||revealed?c:null,{key:'dealer-'+i})).join('')}</div><span class="dealer-value">${revealed?bjValue(S.dealer):bjValue([S.dealer[0]])+' + ?'}</span><div class="blackjack-line"></div><p class="blackjack-caption">Le blackjack paie 3 pour 2</p></section>${S.phase==='roundEnd'?roundResultsHTML():''}`;}
function roundResultsHTML(wrap=true){return `${wrap?'<section class="round-results"><h2>Cette main est jouée.</h2>':''}<table class="results-table"><thead><tr><th>Joueur</th><th>Résultat</th><th>Gain net</th><th>Solde</th></tr></thead><tbody>${S.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.bet?esc(p.verdict):'Sans mise'}</td><td class="${p.change>0?'positive':p.change<0?'negative':''}">${p.bet?(p.change>0?'+':'')+p.change:'—'}</td><td>${p.chips}</td></tr>`).join('')}</tbody></table>${wrap?'</section>':''}`;}
function actionsHTML(){if(isOnline()&&(!net.connected||netPaused()||net.pending||S.turn!==net.me&&S.phase!=='roundEnd'&&S.phase!=='dealer'))return `<div class="action-zone"><p class="action-note">${esc(onlineWaitingText())}</p></div>`;if(isOnline()&&S.phase==='roundEnd'&&net.me!==0)return '<div class="action-zone"><p class="action-note">L’hôte va lancer la main suivante.</p></div>';if(S.phase==='roundEnd')return `<div class="action-zone">${button('Main suivante '+icon('arrow'),'nextRound')}</div>`;if(S.phase==='dealer'||player(S).bot)return '<div class="action-zone"><p class="action-note">La table joue… <span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span></p></div>';if(busy)return '<div class="action-zone"><p class="action-note">Les dés roulent…</p></div>';
 if(S.id==='huit'){if(showSuit)return `<div class="action-note">Quelle couleur demandez-vous ?</div><div class="suit-chooser">${SUITS.map(s=>`<button class="${['H','D'].includes(s)?'red-suit':''}" data-action="choose-suit" data-suit="${s}" aria-label="Choisir ${SUIT_NAMES[s]}">${SYMBOLS[s]}</button>`).join('')}</div><div class="action-zone"><button class="btn ghost small" data-action="cancel-suit">Annuler</button></div>`;return `<div class="action-zone">${S.phase==='afterdraw'?button('Garder et passer','pass',{},false,'secondary'):button('Piocher une carte','draw',{},false,'secondary')}${button(S.announced?'Carte annoncée ✓':'Carte !','announce',{},player(S).hand.length!==2||S.announced,S.announced?'ghost':'')}</div>`;}
 if(S.id==='oie')return `<div class="action-zone">${button(player(S).wait?'Patienter un tour':'Lancer les dés','roll')}</div>`;
 if(ARCADE_IDS.includes(S.id))return arcadeActionsHTML();
 if(S.id==='cactus'){let x='';if(S.phase==='peek')x=button('C’est mémorisé '+icon('check'),'ready');if(S.phase==='draw')x=button('Piocher','draw',{},false,'secondary')+button('Prendre la défausse','take',{},!S.discard.length,'secondary')+button('Cactus ! · ≤ 6','call',{},S.caller!==null);if(S.phase==='swap')x=S.source==='draw'?button('Jeter la pioche','discard',{},false,'secondary'):'<p class="action-note">Remplacez une de vos quatre cartes.</p>';if(S.phase==='power')x=button('Ignorer le pouvoir','skip',{},false,'ghost');if(S.phase==='reveal')x=button('C’est noté '+icon('check'),'ready');return `<div class="action-zone">${x}</div>`;}
 if(S.id==='president'){const cards=player(S).hand.filter(c=>selection.has(c.id));return `<div class="action-zone">${button('Poser'+(selection.size?' · '+selection.size:''),'play',{ids:[...selection]},!presidentLegal(S,cards))}${button('Passer','pass',{},!S.trick,'secondary')}<button class="btn ghost small" data-action="clear-selection" ${!selection.size?'disabled':''}>Désélectionner</button></div>`;}
 if(S.id==='menteur')return `<div class="action-zone">${S.phase==='challenge'?button('Je te crois','trust',{},false,'secondary')+button('Menteur !','challenge',{},false,'danger'):button('Annoncer '+(selection.size||'…')+' × '+rankName(S.required),'play',{ids:[...selection]},selection.size<1||selection.size>4)+'<button class="btn ghost small" data-action="clear-selection">Désélectionner</button>'}</div>`;
 if(S.id==='pouilleux')return '<div class="action-zone"><p class="action-note">Cliquez sur une carte cachée au centre de la table.</p></div>';
 if(S.id==='vingtetun')return S.phase==='bet'?'':`<div class="action-zone">${button('Tirer','hit')}${button('Rester','stand',{},false,'secondary')}${button('Doubler','double',{},player(S).hand.length!==2||player(S).chips<player(S).bet,'ghost')}</div>`;

 if(S.id==='golf'){
  const course=GOLF_COURSES[S.stage-1],pos=S.golfPos,path=S.golfPath.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),moving=path&&motions(),defaultAngle=Math.round(Math.atan2(course.hole.y-pos.y,course.hole.x-pos.x)*180/Math.PI);
  return `<div class="golf-wrap"><svg class="golf-course" viewBox="0 0 660 300" role="img" aria-label="Piste ${S.stage}. Balle à ${Math.round(pos.x)}, ${Math.round(pos.y)} ; portail à ${course.hole.x}, ${course.hole.y}."><defs><radialGradient id="space-felt"><stop stop-color="#2c5260"/><stop offset="1" stop-color="#182636"/></radialGradient><radialGradient id="rock-shade"><stop stop-color="#7d82a0"/><stop offset="1" stop-color="#424861"/></radialGradient></defs><rect x="7" y="7" width="646" height="286" rx="23" fill="url(#space-felt)" stroke="#769898" stroke-width="3"/><rect x="18" y="18" width="624" height="264" rx="16" fill="none" stroke="#a7c3b326" stroke-dasharray="3 9"/>${Array.from({length:23},(_,i)=>`<circle cx="${32+(i*97)%591}" cy="${29+(i*43)%237}" r="${i%3===0?1.4:.7}" fill="#e5efd5" opacity=".4"/>`).join('')}${course.obstacles.map((o,i)=>`<g><circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="url(#rock-shade)" stroke="#adb2c677" stroke-width="2"/><circle cx="${o.x-o.r*.3}" cy="${o.y-o.r*.3}" r="${o.r*.23}" fill="#31374c" opacity=".5"/><path d="M${o.x-o.r*.4} ${o.y+o.r*.4}l${o.r*.4} ${-o.r*.17}" stroke="#a4a0ba55" stroke-width="4" stroke-linecap="round"/></g>`).join('')}<g class="golf-portal ${S.golfSunk?'portal-won':''}" style="transform-origin:${course.hole.x}px ${course.hole.y}px"><circle cx="${course.hole.x}" cy="${course.hole.y}" r="21" fill="#a1e2d310" stroke="#a1e2d366"/><circle cx="${course.hole.x}" cy="${course.hole.y}" r="14" fill="#122b36" stroke="#c6f1db" stroke-width="3"/><circle cx="${course.hole.x}" cy="${course.hole.y}" r="7" fill="#c6f1db22"/></g>${path?`<path class="golf-trail" data-motion-key="trail-${S.played}-${S.golfStroke}" d="${path}" pathLength="1" fill="none" stroke="#f3e3a8" stroke-width="2" opacity=".65"/>`:''}${playing?`<g id="golf-aim" transform="translate(${pos.x} ${pos.y}) rotate(${defaultAngle})"><path d="M12 0h43m-8-5 8 5-8 5" fill="none" stroke="#e9dc9a" stroke-width="2" stroke-linecap="round"/></g>`:''}<g data-motion-key="ball-${S.played}-${S.golfStroke}">${moving?`<circle r="7" fill="#fff4cf" stroke="#c4b792" stroke-width="1.5"><animateMotion dur="1.05s" path="${path}" fill="freeze" calcMode="paced"/></circle>`:`<circle cx="${pos.x}" cy="${pos.y}" r="7" fill="#fff4cf" stroke="#c4b792" stroke-width="1.5"/>`}</g><text x="32" y="43" font-size="10" fill="#b5d0c7" letter-spacing="2">SECTEUR 0${S.stage}</text></svg></div><div class="golf-strokes">${Array.from({length:4},(_,i)=>`<span class="${i<S.golfStroke?'used':''}">${i+1}</span>`).join('')}<small>${4-S.golfStroke} coups disponibles</small></div>${playing?`<form id="golf-form" class="golf-controls" data-motion-key="golf-form-${S.played}-${S.golfStroke}"><label>Direction <output id="golf-angle-out">${defaultAngle}°</output><input aria-label="Direction du tir" id="golf-angle" type="range" min="-180" max="180" value="${defaultAngle}"></label><label>Puissance <output id="golf-power-out">50 %</output><input aria-label="Puissance du tir" id="golf-power" type="range" min="5" max="100" value="50"></label><button class="btn" type="submit">Tirer ↗</button></form>`:''}`;
 }
 if(S.id==='code'){
  const revealed=['result','over'].includes(S.phase),won=S.codeHistory.at(-1)?.exact===3;
  return `<div class="vault ${won?'vault-open':''}"><div class="vault-rings"><span>✧</span></div><div class="vault-code" aria-label="${revealed?'Code du coffre':'Code masqué'}">${(revealed?S.secret:[null,null,null]).map(c=>`<span style="--gem:${c===null?'#dac4ed':CODE_COLORS[c]}">${c===null?'?':CODE_SYMBOLS[c]}</span>`).join('')}</div><p>${won?'ACCÈS AUTORISÉ':revealed?'COMBINAISON RÉVÉLÉE':'DÉCHIFFREZ LE VERROU'}</p></div><div class="code-history" aria-label="Historique des propositions">${S.codeHistory.map((h,i)=>`<div class="code-row" data-motion-key="code-${S.played}-${i}"><small>${i+1}</small><div>${h.colors.map(c=>`<b style="color:${CODE_COLORS[c]}">${CODE_SYMBOLS[c]}</b>`).join('')}</div><span><strong>${h.exact}</strong> bien placé(s)<br><strong>${h.near}</strong> à déplacer</span></div>`).join('')||'<p>Trois symboles. Six possibilités. À vous de déduire.</p>'}</div>${playing?`<form id="code-form" class="code-form"><div class="code-selects">${[0,1,2].map((c,i)=>`<label><span>Position ${i+1}</span><select id="code-${i}" aria-label="Symbole en position ${i+1}">${CODE_SYMBOLS.map((symbol,j)=>`<option value="${j}" ${j===c?'selected':''}>${symbol} · ${j+1}</option>`).join('')}</select></label>`).join('')}</div><button class="btn" type="submit">Tester le code</button></form><p class="arcade-instruction">${6-S.codeHistory.length} propositions restantes · doublons autorisés</p>`:''}`;
 }
 return `<p class="intrus-caption">Une anomalie dans la constellation.</p><div class="intrus-grid" style="--columns:${S.intrusCount<=9?3:S.intrusCount<=16?4:5}" role="group" aria-label="Trouvez le dessin différent">${Array.from({length:S.intrusCount},(_,i)=>{const revealed=['result','over'].includes(S.phase),different=S.intrusTiles?S.intrusTiles[i]:i===S.intrusIndex;return `<button class="intrus-cell ${S.tried.includes(i)?'tried':''} ${revealed&&different?'found':''}" ${attrs({type:'spot',index:i})} ${!playing||S.tried.includes(i)?'disabled':''} aria-label="Symbole ${i+1}${revealed&&different?', intrus':''}" style="--entrance:${i*12}ms">${intrusGlyph(S.stage,different)}${revealed&&different?'<span class="intrus-check">✓</span>':''}</button>`;}).join('')}</div><p class="arcade-instruction">${3-S.tried.length} essais restants · observez les petits détails</p>`;
}
document.addEventListener('submit',e=>{
 if(e.target.id==='golf-form'){e.preventDefault();dispatch({type:'shoot',angle:Number($('golf-angle').value),power:Number($('golf-power').value)});}
 if(e.target.id==='code-form'){e.preventDefault();dispatch({type:'codeGuess',colors:[0,1,2].map(i=>Number($('code-'+i).value))});}
});
document.addEventListener('input',e=>{
 if(e.target.id==='golf-angle'){const n=Number(e.target.value);$('golf-angle-out').textContent=n+'°';$('golf-aim')?.setAttribute('transform',`translate(${S.golfPos.x} ${S.golfPos.y}) rotate(${n})`);}
 if(e.target.id==='golf-power')$('golf-power-out').textContent=e.target.value+' %';
});

applyPrefs();showHome();bootOnlineInvite();
</script></body></html>
