'use strict';
const SUITS=['S','H','D','C'];
const SYMBOLS={S:'♠',H:'♥',D:'♦',C:'♣'};
const SUIT_NAMES={S:'pique',H:'cœur',D:'carreau',C:'trèfle'};
const RANKS={1:'A',11:'V',12:'D',13:'R'};
const TILE_COLORS=['rouge','bleu','ambre','noir'];
const GAMES={
 huit:{name:'8 américain',short:'8 américain',tag:'Un classique qui a du répondant.',desc:'Changez la couleur, renversez le jeu et videz votre main.',category:'cartes',kind:'Dynamique',time:'10–15 min',min:2,max:6,accent:'#b0c9a0',bg:'#395a43',symbol:'8',rules:['But : être le premier à poser toutes ses cartes. Chacun reçoit 7 cartes.','Posez une carte de la même couleur (pique, cœur, carreau ou trèfle) ou de la même valeur que la défausse. Le 8 se pose sur tout et permet de choisir la couleur.','Un as fait piocher 2 cartes au suivant et saute son tour, le 7 saute un tour, le valet inverse le sens (à deux, il saute un tour). Les pénalités ne se cumulent pas.','Vous pouvez piocher une carte. Si elle est jouable, posez-la ou passez ; les autres cartes attendent votre prochain tour.','Avant de passer de 2 cartes à 1, appuyez sur « Carte ! ». Un oubli ajoute 2 cartes. Une main vide gagne immédiatement.']},
 oie:{name:"Jeu de l’oie",short:"Jeu de l’oie",tag:'Le hasard fait bien les choses. Parfois.',desc:'Deux dés, 63 cases et quelques détours inattendus.',category:'plateau',kind:'Chance',time:'10–20 min',min:2,max:6,accent:'#dfc296',bg:'#725439',symbol:'⚄',rules:['Atteignez exactement la case 63. Lancez deux dés à chaque tour. Un dépassement vous fait reculer du nombre de cases en trop.','Sur une oie (5, 9, 14, 18, 23, 27, 32, 36, 41, 45, 50, 54, 59), avancez à nouveau du total des dés ; après un rebond, reculez.','Pont (6) : allez en 12. Auberge (19) : passez 2 tours. Labyrinthe (42) : retour en 30. Tête de mort (58) : retour au départ.','Puits (31) et prison (52) : attendez qu’un autre joueur vous remplace, au maximum 3 tours dans cette variante.','Au premier lancer, un 9 obtenu avec 3 + 6 mène en 26 ; avec 4 + 5, en 53. Plusieurs pions peuvent partager une case ordinaire.']},
 cactus:{name:'Le Cactus',short:'Cactus',tag:'Gardez les bonnes cartes en tête.',desc:'Quatre cartes cachées. Votre mémoire fait la différence.',category:'cartes',kind:'Mémoire',time:'10–15 min',min:2,max:6,accent:'#d1d19d',bg:'#666b3d',symbol:'✳',rules:['But : finir avec le moins de points. Chacun a 4 cartes cachées et regarde seulement ses 2 cartes du bas au départ.','À votre tour, piochez une carte du paquet ou prenez celle de la défausse. Échangez-la avec une de vos cartes, ou jetez-la si elle vient du paquet.','Une carte piochée au paquet puis jetée donne un pouvoir : 7 ou 8, regardez une carte à vous ; 9 ou 10, regardez une carte adverse ; valet ou dame, échangez à l’aveugle une de vos cartes avec une carte adverse. Vous pouvez ignorer le pouvoir.','As = 1 ; cartes de 2 à 10 = leur valeur ; valet = 11 ; dame = 12 ; roi noir = 13 ; roi rouge = −2.','Au début de votre tour, annoncez « Cactus ! » si votre total vous semble assez bas. Chacun des autres joue une dernière fois. Toutes les cartes sont révélées ; le minimum gagne, avec égalités possibles.']},
 president:{name:'Le Président',short:'Président',tag:'Une main pour changer la hiérarchie.',desc:'Montez les enchères et prenez la tête de la table.',category:'cartes',kind:'Stratégie',time:'10–20 min',min:2,max:6,accent:'#c5b7dc',bg:'#534766',symbol:'♛',rules:['Débarrassez-vous de toutes vos cartes. L’ordre croissant est 3, 4, …, 10, valet, dame, roi, as, 2.','Le premier pose une carte ou plusieurs cartes de même valeur. Il faut répondre avec le même nombre de cartes, d’une valeur supérieure, ou passer. Une nouvelle pose réautorise tous les joueurs à répondre.','Lorsque tous les autres joueurs encore en jeu passent, le dernier à avoir posé ouvre un nouveau pli. S’il a terminé, le suivant encore en jeu ouvre.','Variante révolution : un carré peut être posé sur tout. Il vide le pli et inverse entièrement l’ordre des valeurs, jusqu’au prochain carré.','Le premier est Président. À la manche suivante, le dernier lui donne ses 2 meilleures cartes et reçoit ses 2 moins bonnes. À 4 joueurs ou plus, les deux rangs intermédiaires échangent aussi 1 carte (sauf s’ils font partie du premier échange). Les échanges sont automatiques.']},
 menteur:{name:'Le Menteur',short:'Menteur',tag:'Un peu de culot, beaucoup de bluff.',desc:'Annoncez, bluffez… et choisissez qui croire.',category:'cartes',kind:'Bluff',time:'10–20 min',min:2,max:6,accent:'#afced1',bg:'#3d6065',symbol:'?',rules:['Videz votre main en posant de 1 à 4 cartes, face cachée. La valeur annoncée suit le cycle as, 2, 3, …, roi, puis as. Vous pouvez dire vrai ou bluffer.','Dans cette variante, le joueur suivant peut contester avec « Menteur ! » avant de jouer, ou accepter l’annonce.','Si une carte du dernier coup a une autre valeur que l’annonce, le menteur ramasse tout le tas. Sinon, celui qui a contesté ramasse. Les cartes contestées sont révélées.','Une fois l’annonce résolue, le joueur suivant joue la valeur suivante, même s’il vient de ramasser.','Une dernière pose ne gagne qu’une fois acceptée, ou après une accusation injustifiée. Un bluff démasqué ne peut pas gagner.']},
 vingtetun:{name:'Le Vingt-et-un',short:'Vingt-et-un',tag:'Savoir quand s’arrêter, tout un art.',desc:'Approchez 21 et défiez la banque, sans le dépasser.',category:'cartes',kind:'Prise de risque',time:'10–15 min',min:1,max:6,accent:'#ddca91',bg:'#3f6154',symbol:'21',rules:['Vous commencez avec 1 000 jetons fictifs. Après 15 mains, le plus de jetons gagne. Aucun argent réel.','Misez de 10 à 200 jetons (ou votre solde restant s’il est inférieur à 10). Vous recevez 2 cartes, la banque aussi, dont une cachée.','Les figures valent 10 ; l’as vaut 1 ou 11. Tirez une carte ou restez. Au-delà de 21, vous perdez la mise. Sur vos 2 premières cartes, « Doubler » double la mise et donne exactement une dernière carte. Pas de séparation de paires.','La banque tire sous 17 et reste à 17, même avec un as compté 11. Un blackjack naturel (as + carte de valeur 10) bat un 21 en 3 cartes ou plus.','Victoire : la mise est rendue avec un gain égal. Blackjack naturel : gain de 1,5 fois la mise. Égalité : mise rendue. Les joueurs sans jetons quittent les mains suivantes.']},
 pouilleux:{name:'Le Pouilleux',short:'Pouilleux',tag:'Une dame. Un peu trop de suspense.',desc:'Formez des paires et évitez la dernière dame de pique.',category:'cartes',kind:'Chance & bluff',time:'5–10 min',min:2,max:6,accent:'#dbb2bc',bg:'#734b57',symbol:'♠',rules:['Les 3 dames autres que la dame de pique sont retirées du paquet. Les 49 cartes restantes sont distribuées.','Les paires de même valeur sont défaussées automatiquement, quelle que soit leur couleur. La dame de pique ne peut former aucune paire.','À votre tour, choisissez une carte cachée chez le prochain joueur qui a encore des cartes. Toute nouvelle paire est retirée ; votre main est remélangée.','Une main vide vous met à l’abri. Les autres continuent à jouer. Le dernier joueur avec la dame de pique perd ; tous les autres gagnent.']},
 rummikub:{name:'Le Rummikub',short:'Rummikub',tag:'Chaque tuile trouve sa place.',desc:'Créez des suites, combinez et réinventez la table.',category:'plateau',kind:'Stratégie',time:'15–30 min',min:2,max:5,accent:'#d3c0a0',bg:'#70614b',symbol:'123',rules:['106 tuiles : 2 exemplaires de 1 à 13 dans 4 couleurs et 2 jokers. Chacun commence avec 14 tuiles. Videz votre chevalet.','Une combinaison est un groupe de 3 ou 4 tuiles de même nombre dans des couleurs différentes, ou une suite d’au moins 3 nombres consécutifs de même couleur. Pas de boucle 13 → 1.','Votre première pose doit totaliser au moins 30 points, uniquement avec vos tuiles, en une ou plusieurs combinaisons. Un joker prend la valeur qu’il remplace.','Après votre première pose, vous pouvez recomposer toute la table, y compris déplacer un joker. Toutes les combinaisons doivent être valides à la fin ; aucune tuile qui était déjà sur la table ne peut revenir sur votre chevalet.','Sélectionnez des tuiles, puis « Nouveau groupe » ou « Ajouter ici ». « Défaire le tour » restaure le départ. « Valider le tour » exige au moins une tuile posée. Piocher annule le chantier et termine le tour.','Les couleurs portent aussi des repères : rouge ●, bleu ◆, ambre ▲, noir ■. Si la pioche est épuisée et que tous passent, le plus petit total restant gagne (joker = 30).']}
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function deck(copies=1){let a=[];for(let d=0;d<copies;d++)for(const suit of SUITS)for(let rank=1;rank<=13;rank++)a.push({id:d+'-'+suit+'-'+rank,suit,rank});return shuffle(a);}
function clone(x){return JSON.parse(JSON.stringify(x));}
function rankName(r){return RANKS[r]||String(r);}
function say(s,text){s.log.unshift(text);s.log=s.log.slice(0,35);s.message=text;}
function player(s,i=s.turn){return s.players[i];}
function active(s){return s.players.map((p,i)=>i).filter(i=>s.players[i].hand.length);}
function next(s,i=s.turn,eligible=()=>true,dir=1){for(let k=1;k<=s.players.length;k++){let n=(i+k*dir+s.players.length*10)%s.players.length;if(eligible(n))return n;}return i;}
function finish(s,winners,reason){s.phase='over';s.winners=Array.isArray(winners)?winners:[winners];s.reason=reason;s.finishedAt=Date.now();say(s,reason);}
function draw(s,n=1){const out=[];for(let i=0;i<n;i++){if(!s.deck.length&&s.discard&&s.discard.length>1){const top=s.discard.pop();s.deck=shuffle(s.discard);s.discard=[top];}if(s.deck.length)out.push(s.deck.pop());}return out;}
function basic(s){s.turn=0;s.phase='play';s.moves=0;s.winners=[];s.log=[];s.message='La partie commence.';s.recorded=false;s.startedAt=Date.now();return s;}
function createGame(id,config,old=null){
 const s=basic({version:3,id,mode:config.mode,round:old?old.round+1:1,config:clone(config),players:config.names.map((name,i)=>({name:name.slice(0,24)||'Joueur '+(i+1),bot:config.mode==='solo'&&i>0,hand:[],score:0})),deck:[],discard:[]});
 if(id==='rummikub'){let t=[];for(let d=0;d<2;d++)for(let color=0;color<4;color++)for(let num=1;num<=13;num++)t.push({id:'t'+d+'-'+color+'-'+num,tile:true,color,num});t.push({id:'j0',tile:true,joker:true},{id:'j1',tile:true,joker:true});s.deck=shuffle(t);for(const p of s.players){p.hand=s.deck.splice(-14);p.opened=false;}s.table=[];rummiSnapshot(s);}
 else if(id==='oie'){for(const p of s.players){p.pos=0;p.wait=0;p.trapped=false;p.rolled=false;}s.dice=[1,1];s.path=[];}
 else if(id==='cactus'){s.deck=deck(s.players.length>4?2:1);for(const p of s.players){p.hand=s.deck.splice(-4);p.known={2:clone(p.hand[2]),3:clone(p.hand[3])};}s.discard=[s.deck.pop()];s.peekers=s.players.map((p,i)=>i).filter(i=>!s.players[i].bot);s.turn=s.peekers[0]??0;s.phase=s.peekers.length?'peek':'draw';s.caller=null;s.left=0;}

function setupNames(){let a=[];for(let i=0;i<setup.count;i++){const prev=document.querySelector(`[name="player-${i}"]`);a.push(prev?.value||setup.names[i]||(setup.mode==='solo'?(i?BOT_NAMES[i-1]:'Vous'):'Joueur '+(i+1)));}setup.names=a;}
function openSetup(id){setup={id,mode:'solo',count:id==='vingtetun'?1:Math.min(3,GAMES[id].max),names:[]};renderSetup();}
function renderSetup(){const g=GAMES[setup.id];setup.count=Math.max(setup.mode==='local'?Math.max(2,g.min):g.min,Math.min(setup.count,g.max));const min=setup.mode==='local'?Math.max(2,g.min):g.min;modal(`<div class="eyebrow">INSTALLEZ-VOUS</div><h2>${g.name}</h2><p class="modal-subtitle">${g.tag}</p><div class="setup-art" style="--art-bg:${g.bg}" aria-hidden="true">${art(setup.id)}</div><form id="setup-form"><div class="mode-tabs" role="group" aria-label="Mode de jeu"><button type="button" data-action="mode" data-mode="solo" class="${setup.mode==='solo'?'active':''}" aria-pressed="${setup.mode==='solo'}">${setup.id==='vingtetun'?'Face à la banque':'Contre l’IA'}</button><button type="button" data-action="mode" data-mode="local" class="${setup.mode==='local'?'active':''}" aria-pressed="${setup.mode==='local'}">Entre amis · même écran</button></div><div class="field"><label for="player-count">Nombre de joueurs à la table</label><select id="player-count">${Array.from({length:g.max-min+1},(_,k)=>min+k).map(n=>`<option value="${n}" ${setup.count===n?'selected':''}>${n} joueur${n>1?'s':''}${setup.mode==='solo'&&n>1?' · vous + '+(n-1)+' IA':''}</option>`).join('')}</select></div><div class="${setup.mode==='local'?'field-row':''}">${Array.from({length:setup.mode==='local'?setup.count:1},(_,i)=>`<div class="field"><label for="player-${i}">${setup.mode==='solo'?'Votre prénom':'Joueur '+(i+1)}</label><input type="text" id="player-${i}" name="player-${i}" value="${esc(setup.names[i]||(setup.mode==='solo'?'Vous':'Joueur '+(i+1)))}" maxlength="24" autocomplete="off" required></div>`).join('')}</div><button type="submit" class="btn full">C’est parti ${icon('arrow')}</button><p class="mode-note">${setup.mode==='solo'?'Les adversaires jouent automatiquement, sans connexion.':'Passez l’appareil entre les tours. Un écran de confidentialité protège chaque main.'}</p></form><div class="privacy-notice">${icon('save')}<span>Une partie en cours est conservée dans ce navigateur. Démarrer une nouvelle table remplace cette sauvegarde.</span></div>`,'setup');}
function openRules(id=S?.id){const g=GAMES[id];modal(`<div class="eyebrow">LES RÈGLES DE LA TABLE</div><h2>${g.name}</h2><p class="modal-subtitle">Les variantes jouées ici, pour que tout le monde soit d’accord.</p><ol class="rules-list">${g.rules.map(t=>`<li>${t}</li>`).join('')}</ol><button class="btn full" data-action="close-modal">Compris, on joue ${icon('check')}</button>`,'rules');}
function openSettings(){modal(`<div class="eyebrow">À VOTRE GOÛT</div><h2>Les petits réglages.</h2><p class="modal-subtitle">Un peu d’ambiance, et le rythme qui vous convient.</p><label class="setting-row"><span><strong>Ambiance sonore</strong><p>Cartes, dés et notes de victoire.</p></span><input type="checkbox" class="toggle" id="pref-sound" ${prefs.sound?'checked':''}></label><label class="setting-row"><span><strong>Animations</strong><p>Distributions, mouvements et confettis.</p></span><input type="checkbox" class="toggle" id="pref-motion" ${prefs.motion?'checked':''}></label><label class="setting-row"><span><strong>Rythme rapide</strong><p>Les adversaires réfléchissent moins longtemps.</p></span><input type="checkbox" class="toggle" id="pref-fast" ${prefs.fast?'checked':''}></label><div class="eyebrow" style="margin:27px 0 15px">VOS PARTIES EN SOLO</div><div class="stats-bar"><div><strong>${stats.played}</strong><span>parties terminées</span></div><div><strong>${stats.wins}</strong><span>victoires</span></div><div><strong>${stats.played?Math.round(stats.wins/stats.played*100):0}%</strong><span>de réussite</span></div></div><p class="modal-subtitle">Les statistiques et la sauvegarde restent dans ce navigateur. Les parties entre amis ne comptent pas dans ce bilan.</p><button class="btn full" data-action="close-modal">C’est parfait ${icon('check')}</button>`,'settings');}
function toast(message){$('toasts').innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toasts').innerHTML='',3600);}
function sound(kind='card'){if(!prefs.sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;const notes=kind==='win'?[523.25,659.25,783.99,1046.5]:kind==='dice'?[170,260,200]:kind==='error'?[160]:[370,520];notes.forEach((freq,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.type=kind==='dice'?'triangle':'sine';osc.frequency.setValueAtTime(freq,now+i*.065);gain.gain.setValueAtTime(0,now+i*.065);gain.gain.linearRampToValueAtTime(.035,now+i*.065+.008);gain.gain.exponentialRampToValueAtTime(.001,now+i*.065+(kind==='win'?.35:.085));osc.start(now+i*.065);osc.stop(now+i*.065+.4);});}catch{}}
function motions(){return prefs.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches;}
function save(){if(!S)return;savedOkay=storage.set('saved',S);saved=clone(S);}
function record(){if(S.phase==='over'&&!S.recorded){S.recorded=true;if(S.mode==='solo'){stats.played++;const win=S.winners.includes(0);if(win)stats.wins++;stats.byGame[S.id]??={played:0,wins:0};stats.byGame[S.id].played++;if(win)stats.byGame[S.id].wins++;storage.set('stats',stats);}}}
function startGame(config,id,old=null){clearTimeout(timer);S=createGame(id,config,old);view='game';gate=S.mode==='local'&&id!=='oie';selection.clear();showSuit=null;busy=false;closeModal(false);save();renderGame(true);window.scrollTo(0,0);sound();schedule();}
function canPlay(){return !!S&&!gate&&!busy&&!player(S).bot&&S.phase!=='over'&&S.phase!=='dealer'&&S.phase!=='roundEnd'&&view==='game';}
function privateIndex(){if(S.phase==='over')return S.mode==='solo'?0:S.turn;if(S.mode==='solo')return 0;return S.turn;}
function attrs(a){return `data-action="game" data-gameact="${esc(JSON.stringify(a))}"`;}
function button(text,type,extra={},disabled=false,classes=''){return `<button class="btn ${classes}" ${attrs({type,...extra})} ${disabled?'disabled':''}>${text}</button>`;}
function avatar(i){return `<span class="avatar" style="--player-color:${COLORS[i]}">${esc(S.players[i].name[0]?.toUpperCase()||'?')}</span>`;}
function playerStatus(i){const p=S.players[i];if(S.id==='oie')return `Case ${p.pos}${p.wait?' · attente '+p.wait:''}`;if(S.id==='cactus')return S.phase==='over'?`${S.totals[i]} points`:S.caller===i?'A annoncé Cactus':'4 cartes cachées';if(S.id==='vingtetun')return `${p.chips.toLocaleString('fr-FR')} jetons${p.bet?' · mise '+p.bet:''}`;if(S.id==='president'&&S.order.includes(i))return `Place ${S.order.indexOf(i)+1}`;if(S.id==='pouilleux'&&!p.hand.length)return 'À l’abri ✓';if(S.id==='rummikub')return `${p.hand.length} tuiles · ${p.opened?'sortie faite':'30 pts requis'}`;return p.hand.length+' carte'+(p.hand.length>1?'s':'');}
function playersHTML(){return S.players.map((p,i)=>`<div class="player-row ${i===S.turn&&S.phase!=='over'?'current':''}">${avatar(i)}<div><div class="player-name">${esc(p.name)} ${p.bot?'<span style="opacity:.55;font-size:8px">IA</span>':''}</div><div class="player-detail">${playerStatus(i)}</div></div><span class="player-marker">${S.phase==='over'&&S.winners.includes(i)?'♛':i===S.turn?'•':''}</span></div>`).join('');}
function turnText(){if(S.phase==='over')return ['La partie est terminée','Une nouvelle manche ?'];if(gate)return ['À chacun son tour','Les cartes sont masquées.'];if(S.phase==='dealer')return ['La banque joue','Elle tire sous 17 et reste à 17.'];if(S.phase==='roundEnd')return ['Les comptes sont faits','Prêt pour la prochaine main ?'];if(player(S).bot)return [`${player(S).name} joue`,S.message];if(S.id==='cactus'){return ['À vous de jouer',{peek:'Mémorisez vos deux cartes du bas.',draw:S.caller!==null?'Dernier tour : choisissez votre pioche.':'Piochez, ou annoncez Cactus.',swap:'Choisissez la carte à remplacer.',power:S.power==='swap'?(S.swapFirst==null?'Sélectionnez une carte à vous.':'Sélectionnez une carte adverse.'):'Choisissez une carte à regarder.',reveal:'Mémorisez cette carte avant de continuer.'}[S.phase]];}if(S.id==='huit')return ['À vous de jouer',S.phase==='afterdraw'?'Jouez la carte piochée, ou gardez-la et passez.':'Les cartes jouables sont entourées.'];if(S.id==='oie')return ['À vous de lancer',player(S).wait?'Votre pion attend. Validez le tour.':'Il faut atteindre exactement la case 63.'];if(S.id==='president')return ['À vous de jouer',S.trick?'Sélectionnez une combinaison supérieure ou passez.':'Ouvrez avec des cartes de même valeur.'];if(S.id==='menteur')return ['À vous de jouer',S.phase==='challenge'?'Croyez-vous la dernière annonce ?':'Sélectionnez de 1 à 4 cartes. Le bluff est permis.'];if(S.id==='pouilleux')return ['À vous de piocher','Choisissez une carte cachée chez votre voisin.'];if(S.id==='rummikub')return ['À vous de composer','Sélectionnez des tuiles, puis choisissez leur destination.'];return ['À vous de jouer',S.phase==='bet'?'Choisissez votre mise en jetons fictifs.':'Tirez, restez ou doublez la mise.'];}
function logHTML(){return `<details class="log-panel" ${S.id==='oie'?'open':''}><summary>Le fil de la partie</summary><ol>${S.log.slice(0,10).map(t=>`<li>${esc(t)}</li>`).join('')||'<li>Tout commence par une bonne distribution.</li>'}</ol></details>`;}
function winHTML(){let names=S.winners.map(i=>S.players[i].name).join(' & '),title=S.mode==='solo'?(S.winners.includes(0)?'Bien joué, c’est gagné !':'La revanche vous attend.'):'Bravo, '+names+' !';return `<section class="win-box" aria-label="Résultat de la partie"><div class="trophy" aria-hidden="true">♛</div><h2>${esc(title)}</h2><p>${esc(S.reason)}</p>${S.id==='president'?`<table class="results-table"><thead><tr><th>Rang</th><th>Joueur</th><th>Titre</th></tr></thead><tbody>${S.order.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(S.players[i].name)}</td><td>${k===0?'Président':k===S.order.length-1?'Dernier':k===1?'Vice-président':'Citoyen'}</td></tr>`).join('')}</tbody></table>`:''}${S.totals?`<table class="results-table"><thead><tr><th>Joueur</th><th>Points restants</th></tr></thead><tbody>${S.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td class="${S.winners.includes(i)?'positive':''}">${S.totals[i]}</td></tr>`).join('')}</tbody></table>`:''}${S.id==='vingtetun'?roundResultsHTML(false):''}<div class="action-zone"><button class="btn" data-action="replay">${S.id==='president'?'Manche suivante':'Rejouer'} ${icon('shuffle')}</button><button class="btn ghost" data-action="home">Les autres jeux</button></div></section>`;}
function gateHTML(){return `<div class="gate-screen">${avatar(S.turn)}<div class="eyebrow">PASSEZ L’ÉCRAN À</div><h2>${esc(player(S).name)}</h2><p>Les autres joueurs regardent ailleurs.<br>Votre main apparaîtra quand vous serez prêt.</p><button class="btn" data-action="reveal-hand">Je suis ${esc(player(S).name)} ${icon('eye')}</button><span class="saved-indicator">${icon('shield')} À chacun ses cartes.</span></div>`;}
function gameHTML(){const g=GAMES[S.id],[headline,desc]=turnText();return `<header class="game-header"><div class="wrap"><button class="btn ghost" data-action="home">${icon('back')}<span>Les jeux</span></button><div class="game-heading"><h1>${g.name}</h1><p>${S.mode==='solo'?'TABLE SOLO':'ENTRE AMIS'} · ${S.id==='vingtetun'?'MAIN '+S.round+' / 15':'MANCHE '+S.round}</p></div><div class="game-tools"><button class="icon-btn" data-action="rules" aria-label="Règles du jeu" title="Règles du jeu">${icon('rules')}</button>${soundButton()}<button class="icon-btn pause-btn" data-action="pause" aria-label="Mettre la partie en pause">${icon('pause')}</button><button class="icon-btn" data-action="settings" aria-label="Préférences">${icon('settings')}</button></div></div></header><main id="main" class="wrap game-layout"><div class="table-column">${S.phase==='over'?winHTML():''}<div class="turn-banner">${avatar(S.turn)}<div><div class="turn-label" id="turn-label">${esc(headline)} ${player(S).bot&&S.phase!=='over'?'<span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span>':''}</div><div class="turn-desc">${esc(desc)}</div></div><span class="turn-badge">${S.phase==='over'?'Terminé':S.id==='rummikub'?S.deck.length+' tuiles':S.id==='oie'?'Objectif 63':S.id==='cactus'&&S.caller!==null?'Dernier tour':S.id==='vingtetun'?'Jetons fictifs':'À la table'}</span></div>${gate?gateHTML():boardHTML()}${!gate&&S.phase!=='over'?actionsHTML():''}${!gate?handHTML():''}<div class="table-footnote">${savedOkay?`${iconInlineSave()} Sauvegarde automatique dans ce navigateur.`:'La sauvegarde est indisponible dans ce navigateur. Gardez cet onglet ouvert.'}</div>${logHTML()}</div><aside class="sidebar" aria-label="Joueurs"><div class="sidebar-label">AUTOUR DE LA TABLE · ${S.players.length}</div><div class="players">${playersHTML()}</div><div class="sidebar-tip"><div class="eyebrow">LE PETIT RAPPEL</div><p>${g.rules[0]}</p><button data-action="rules">Toutes les règles ↗</button></div></aside></main>`;}
function iconInlineSave(){return '✓';}
function boardHTML(){if(S.id==='huit')return `<section class="felt" aria-label="Table du 8 américain"><div class="center-piles"><div class="pile"><div class="stack">${cardHTML(null,{button:canPlay()&&S.phase==='play',attr:attrs({type:'draw'}),label:'Piocher une carte'})}</div><div class="pile-label">PIOCHE · ${S.deck.length}</div></div><div class="pile">${cardHTML(S.discard.at(-1),{key:'c-'+S.discard.at(-1).id})}<div class="pile-label">DÉFAUSSE</div></div></div><div class="suit-chip"><b class="${['H','D'].includes(S.suit)?'red-suit':''}">${SYMBOLS[S.suit]}</b> ${SUIT_NAMES[S.suit]} demandé <span style="margin-left:9px">${S.dir===1?'↻':'↺'}</span></div><span class="felt-mark">LA TABLE DE JEUX</span></section>`;
 if(S.id==='oie')return gooseBoardHTML();if(S.id==='cactus')return cactusBoardHTML();if(S.id==='rummikub')return rummiBoardHTML();if(S.id==='vingtetun')return blackjackBoardHTML();
 if(S.id==='president')return `<section class="felt" aria-label="Table du Président"><p class="table-text">${S.revolution?'RÉVOLUTION · 2 < A < R < D < V < 10 … < 3':'3 < 4 < 5 < 6 < 7 < 8 < 9 < 10 < V < D < R < A < 2'}</p><div class="trick-cards">${S.trick?S.trick.cards.map(c=>cardHTML(c,{key:'c-'+c.id})).join(''):'<div class="empty-trick">♛</div>'}</div><div class="table-text">${S.trick?`${esc(S.players[S.trick.owner].name)} · ${S.trick.cards.length} carte${S.trick.cards.length>1?'s':''} à battre`:'Un nouveau pli. À vous de donner le ton.'}</div>${S.passed.length?`<div class="table-text">Ont passé : ${S.passed.map(i=>esc(S.players[i].name)).join(', ')}</div>`:''}<span class="felt-mark">LA TABLE DE JEUX</span></section>`;
 if(S.id==='menteur')return `<section class="felt" aria-label="Table du Menteur"><div class="center-piles"><div class="pile"><div class="stack">${cardHTML(null)}</div><div class="pile-label">LE TAS · ${S.discard.length} CARTE${S.discard.length>1?'S':''}</div></div><div class="claim-info">${S.claim?`${esc(S.players[S.claim.owner].name)} annonce<strong>${S.claim.cards.length} × ${rankName(S.claim.rank)}</strong>Vérité ou joli bluff ?`:`Valeur à annoncer<strong>${rankName(S.required)}</strong>De 1 à 4 cartes, face cachée.`}</div></div>${S.revealed.length?`<div class="table-text">Dernières cartes contestées<div class="reveal-strip">${S.revealed.map(c=>cardHTML(c)).join('')}</div></div>`:''}<span class="felt-mark">LA TABLE DE JEUX</span></section>`;
 const target=next(S,S.turn,k=>pHand(S,k)>0);return `<section class="felt" aria-label="Table du Pouilleux">${S.phase==='over'?`<p class="table-announcement">La dame a choisi sa compagnie.</p>${cardHTML({rank:12,suit:'S'})}`:`<p class="table-text">PIOCHEZ CHEZ ${esc(S.players[target].name.toLocaleUpperCase('fr'))}</p><div class="opponent-hand">${S.players[target].hand.map((c,i)=>cardHTML(null,{button:canPlay(),attr:attrs({type:'pick',index:i}),classes:'pickable',label:'Piocher la carte cachée '+(i+1),key:'opponent-'+target+'-'+i})).join('')}</div><p class="table-text">${S.discard.length/2} paires déjà écartées. La prochaine sera-t-elle la vôtre ?</p>`}<span class="felt-mark">LA TABLE DE JEUX</span></section>`;
}
function boardCoordinates(){const coords=[];let left=0,right=8,top=0,bottom=6;while(left<=right&&top<=bottom){for(let x=left;x<=right;x++)coords.push([x,top]);top++;for(let y=top;y<=bottom;y++)coords.push([right,y]);right--;if(top<=bottom){for(let x=right;x>=left;x--)coords.push([x,bottom]);bottom--;}if(left<=right){for(let y=bottom;y>=top;y--)coords.push([left,y]);left++;}}return coords;}
const CELL_COORDS=boardCoordinates();
function pawnHTML(i){return `<span class="pawn" data-flip="pawn-${i}" style="--player-color:${COLORS[i]}" title="${esc(S.players[i].name)}" aria-label="Pion de ${esc(S.players[i].name)}">${i+1}</span>`;}
function gooseBoardHTML(){return `<section class="felt goose-felt" aria-label="Plateau du jeu de l’oie"><div class="goose-controls"><div class="start-tokens">Départ ${S.players.map((p,i)=>p.pos===0?pawnHTML(i):'').join('')}</div><div class="dice-pair" id="dice">${S.dice.map(n=>dieHTML(n,busy)).join('')}</div><span class="table-text">${S.dice[0]+S.dice[1]} points</span></div><div class="goose-board">${CELL_COORDS.map(([x,y],k)=>{const n=k+1,symbol=GEESE.includes(n)?'♧':({6:'⌒',19:'☕',31:'◉',42:'⤴',52:'▥',58:'↶',63:'♛'}[n]||'');return `<div class="goose-cell ${GEESE.includes(n)?'goose':''} ${[6,19,31,42,52].includes(n)?'trap':''} ${n===58?'danger':''} ${n===63?'goal':''}" data-cell="${n}" style="grid-column:${x+1};grid-row:${y+1}" title="Case ${n}${GEESE.includes(n)?' · Oie':SPECIAL[n]?' · '+SPECIAL[n]:''}"><span class="number">${n}</span><span class="cell-symbol" aria-hidden="true">${symbol}</span><div class="tokens">${S.players.map((p,i)=>p.pos===n?pawnHTML(i):'').join('')}</div></div>`;}).join('')}</div><div class="goose-legend"><span>♧ Oie : rejouez le déplacement</span><span>⌒ Pont</span><span>☕ Auberge</span><span>◉ Puits</span><span>⤴ Labyrinthe</span><span>▥ Prison</span><span>↶ Départ</span></div></section>`;}
function cactusVisible(i,j){if(S.phase==='over')return true;if(!canPlay())return false;if(S.phase==='peek')return i===S.turn&&j>=2;if(S.reveal)return S.reveal.owner===i&&S.reveal.index===j;return false;}
function cactusBoardHTML(){return `<section class="felt cactus-felt" aria-label="Table du Cactus"><div class="cactus-table">${S.players.map((p,i)=>`<div class="cactus-player ${i===privateIndex()?'own':''}"><h3>${esc(p.name)}${S.caller===i?' · Cactus !':''}</h3><div class="cactus-four">${p.hand.map((c,j)=>{const visible=cactusVisible(i,j);let interactive=canPlay()&&((S.phase==='swap'&&i===S.turn)||(S.phase==='power'&&((S.power==='self'&&i===S.turn)||(S.power==='other'&&i!==S.turn)||(S.power==='swap'&&(S.swapFirst==null?i===S.turn:i!==S.turn)))));return cardHTML(visible?c:null,{button:interactive,attr:attrs(S.phase==='swap'?{type:'swap',index:j}:{type:'target',owner:i,index:j}),classes:(interactive?'pickable legal ':'')+(S.swapFirst===j&&i===S.turn?'selected':''),key:'cactus-'+i+'-'+j,label:'Carte '+(j+1)+' de '+p.name});}).join('')}</div>${S.phase==='over'?`<p class="points">${S.totals[i]} <small>POINTS</small></p>`:S.phase==='peek'&&i===S.turn?'<p class="peek-label">Ces deux cartes ne resteront pas visibles.</p>':''}</div>`).join('')}</div>${S.phase!=='over'?`<div class="cactus-draw"><div class="pile">${cardHTML(null,{button:canPlay()&&S.phase==='draw',attr:attrs({type:'draw'}),label:'Piocher au paquet'})}<div class="pile-label">PIOCHE</div></div><div class="pile">${cardHTML(S.discard.at(-1),{button:canPlay()&&S.phase==='draw'&&S.discard.length>0,attr:attrs({type:'take'}),key:S.discard.length?'c-'+S.discard.at(-1).id:undefined})}<div class="pile-label">DÉFAUSSE</div></div>${S.drawn?`<div class="pile">${cardHTML(canPlay()?S.drawn:null,{key:canPlay()?'c-'+S.drawn.id:'drawn-hidden'})}<div class="pile-label">${canPlay()?'VOTRE PIOCHE':'CARTE PIOCHÉE'}</div></div>`:''}</div>`:''}</section>`;}
function rummiBoardHTML(){const mine=canPlay(),oldIds=new Set(S.refTable.flat().map(t=>t.id));return `<section class="felt rummi-felt" aria-label="Table du Rummikub"><div class="rummi-table-top"><span>LA TABLE COMMUNE</span><span>${S.table.flat().length} tuiles posées</span></div>${S.table.some(g=>g.length)?`<div class="rummi-groups">${S.table.map((g,k)=>{if(!g.length)return '';const v=validMeld(g);return `<div class="meld-zone ${v?'valid':'invalid'}" aria-label="Combinaison ${k+1}${v?' valide':' à compléter'}">${g.map(t=>tileHTML(t,{button:mine&&(player(S).opened||!oldIds.has(t.id)),selected:selection.has(t.id),classes:selection.has(t.id)?'selected':'',attr:`data-action="select-tile" data-id="${t.id}"`,key:'t-'+t.id,jokerAs:t.joker&&v?(v.type==='run'?v.start+v.tiles.findIndex(x=>x.id===t.id):v.joker):null})).join('')}${mine&&(player(S).opened||g.every(t=>!oldIds.has(t.id)))?`<button class="add-here" data-action="rummi-place" data-dest="${k}" aria-label="Ajouter les tuiles à la combinaison ${k+1}" ${!selection.size?'disabled':''}>+</button>`:''}</div>`;}).join('')}</div>`:`<div class="rummi-table-empty"><span style="font:40px var(--serif);color:#e7cf96">✳</span><b>Tout reste à composer.</b><p>Les premières suites et les premiers groupes se posent ici. Votre sortie doit atteindre 30 points.</p></div>`}</section>`;}
function blackjackBoardHTML(){if(S.phase==='bet'){const p=player(S),limit=Math.min(200,p.chips);return `<section class="felt"><div class="bet-panel"><h2>Faites vos jeux.</h2><p>${esc(p.name)} · ${p.chips.toLocaleString('fr-FR')} jetons disponibles</p><div class="bet-buttons">${[10,25,50,100].map(n=>`<button class="bet-chip" ${attrs({type:'bet',amount:n})} ${!canPlay()||n>limit?'disabled':''} aria-label="Miser ${n} jetons">${n}</button>`).join('')}</div>${canPlay()?`<form class="bet-custom" id="bet-form"><label for="bet-amount" class="sr-only">Montant de la mise</label><input class="text-input" id="bet-amount" type="number" min="${Math.min(10,p.chips)}" max="${limit}" step="any" value="${Math.min(50,limit)}" required><button class="btn small secondary" type="submit">Miser</button></form>`:''}</div><span class="felt-mark">JETONS FICTIFS · PLAISIR RÉEL</span></section>`;}const revealed=S.dealerRevealed||S.phase==='over';return `<section class="felt" aria-label="Table du Vingt-et-un"><p class="dealer-label">LA BANQUE</p><div class="trick-cards">${S.dealer.map((c,i)=>cardHTML(i===0||revealed?c:null,{key:'dealer-'+i})).join('')}</div><span class="dealer-value">${revealed?bjValue(S.dealer):bjValue([S.dealer[0]])+' + ?'}</span><div class="blackjack-line"></div><p class="blackjack-caption">Le blackjack paie 3 pour 2</p></section>${S.phase==='roundEnd'?roundResultsHTML():''}`;}
function roundResultsHTML(wrap=true){return `${wrap?'<section class="round-results"><h2>Cette main est jouée.</h2>':''}<table class="results-table"><thead><tr><th>Joueur</th><th>Résultat</th><th>Gain net</th><th>Solde</th></tr></thead><tbody>${S.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.bet?esc(p.verdict):'Sans mise'}</td><td class="${p.change>0?'positive':p.change<0?'negative':''}">${p.bet?(p.change>0?'+':'')+p.change:'—'}</td><td>${p.chips}</td></tr>`).join('')}</tbody></table>${wrap?'</section>':''}`;}
function actionsHTML(){if(S.phase==='roundEnd')return `<div class="action-zone">${button('Main suivante '+icon('arrow'),'nextRound')}</div>`;if(S.phase==='dealer'||player(S).bot)return '<div class="action-zone"><p class="action-note">La table joue… <span class="thinking" aria-hidden="true"><i></i><i></i><i></i></span></p></div>';if(busy)return '<div class="action-zone"><p class="action-note">Les dés roulent…</p></div>';
 if(S.id==='huit'){if(showSuit)return `<div class="action-note">Quelle couleur demandez-vous ?</div><div class="suit-chooser">${SUITS.map(s=>`<button class="${['H','D'].includes(s)?'red-suit':''}" data-action="choose-suit" data-suit="${s}" aria-label="Choisir ${SUIT_NAMES[s]}">${SYMBOLS[s]}</button>`).join('')}</div><div class="action-zone"><button class="btn ghost small" data-action="cancel-suit">Annuler</button></div>`;return `<div class="action-zone">${S.phase==='afterdraw'?button('Garder et passer','pass',{},false,'secondary'):button('Piocher une carte','draw',{},false,'secondary')}${button(S.announced?'Carte annoncée ✓':'Carte !','announce',{},player(S).hand.length!==2||S.announced,S.announced?'ghost':'')}</div>`;}
 if(S.id==='oie')return `<div class="action-zone">${button(player(S).wait?'Patienter un tour':'Lancer les dés','roll')}</div>`;
 if(S.id==='cactus'){let x='';if(S.phase==='peek')x=button('C’est mémorisé '+icon('check'),'ready');if(S.phase==='draw')x=button('Piocher','draw',{},false,'secondary')+button('Prendre la défausse','take',{},!S.discard.length,'secondary')+button('Cactus !','call',{},S.caller!==null);if(S.phase==='swap')x=S.source==='draw'?button('Jeter la pioche','discard',{},false,'secondary'):'<p class="action-note">Remplacez une de vos quatre cartes.</p>';if(S.phase==='power')x=button('Ignorer le pouvoir','skip',{},false,'ghost');if(S.phase==='reveal')x=button('C’est noté '+icon('check'),'ready');return `<div class="action-zone">${x}</div>`;}
 if(S.id==='president'){const cards=player(S).hand.filter(c=>selection.has(c.id));return `<div class="action-zone">${button('Poser'+(selection.size?' · '+selection.size:''),'play',{ids:[...selection]},!presidentLegal(S,cards))}${button('Passer','pass',{},!S.trick,'secondary')}<button class="btn ghost small" data-action="clear-selection" ${!selection.size?'disabled':''}>Désélectionner</button></div>`;}
 if(S.id==='menteur')return `<div class="action-zone">${S.phase==='challenge'?button('Je te crois','trust',{},false,'secondary')+button('Menteur !','challenge',{},false,'danger'):button('Annoncer '+(selection.size||'…')+' × '+rankName(S.required),'play',{ids:[...selection]},selection.size<1||selection.size>4)+'<button class="btn ghost small" data-action="clear-selection">Désélectionner</button>'}</div>`;
 if(S.id==='pouilleux')return '<div class="action-zone"><p class="action-note">Cliquez sur une carte cachée au centre de la table.</p></div>';
 if(S.id==='vingtetun')return S.phase==='bet'?'':`<div class="action-zone">${button('Tirer','hit')}${button('Rester','stand',{},false,'secondary')}${button('Doubler','double',{},player(S).hand.length!==2||player(S).chips<player(S).bet,'ghost')}</div>`;
 const d=rummiDiagnostic(S);return `<div class="rummi-status ${d.ok?'valid':''}" role="status">${esc(d.text)}</div><div class="action-zone"><button class="btn secondary" data-action="rummi-place" data-dest="new" ${!selection.size?'disabled':''}>Nouveau groupe +</button>${button('Valider le tour','commit',{},!d.ok)}${button(S.deck.length?'Piocher et finir':'Passer','draw',{},false,'secondary')}${button('Défaire le tour','undo',{},false,'ghost small')}${button('Suggérer un coup','suggest',{},false,'ghost small')}<button class="btn ghost small" data-action="rummi-place" data-dest="hand" ${!selection.size?'disabled':''}>Au chevalet</button></div>`;
}
function handHTML(){if(['oie','cactus'].includes(S.id))return '';if(S.id==='vingtetun'&&S.phase==='bet')return '';const i=privateIndex(),p=S.players[i],mine=canPlay()&&S.turn===i;let cards=[...p.hand];if(S.id==='rummikub')cards.sort((a,b)=>a.joker-b.joker||(sortByColor?(a.color??5)-(b.color??5)||(a.num||0)-(b.num||0):(a.num||99)-(b.num||99)||(a.color||0)-(b.color||0)));else cards.sort((a,b)=>sortByColor?SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit)||a.rank-b.rank:presRank(a.rank)-presRank(b.rank)||SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit));
 const helper=S.id==='huit'?'Touchez une carte entourée pour la jouer.':S.id==='rummikub'?'Sélectionnez des tuiles du chevalet ou de la table, puis leur destination.':S.id==='president'||S.id==='menteur'?'Sélectionnez vos cartes, puis confirmez votre coup.':S.id==='vingtetun'?'As : 1 ou 11 · Figures : 10':'Vos paires sont retirées automatiquement.';
 return `<section class="hand-panel" aria-label="Main de ${esc(p.name)}"><div class="hand-top"><div class="hand-title">${esc(S.mode==='solo'?'Votre '+(S.id==='rummikub'?'chevalet':'main'):p.name)} <span>${cards.length} ${S.id==='rummikub'?'tuiles':'cartes'}</span></div>${S.id==='vingtetun'?`<div class="hand-total">${bjValue(cards)} points ${natural(cards)?'· Blackjack':''}${p.bet?' · Mise '+p.bet:''}</div>`:`<button class="btn ghost small" data-action="sort">Trier par ${sortByColor?'valeur':'couleur'}</button>`}</div>${S.id==='rummikub'?`<div class="rummi-rack">${cards.map(t=>tileHTML(t,{button:mine,selected:selection.has(t.id),classes:selection.has(t.id)?'selected':'',attr:`data-action="select-tile" data-id="${t.id}"`,key:'t-'+t.id})).join('')||'<span class="empty-hand">Chevalet vide. Bien joué !</span>'}</div>`:`<div class="hand ${cards.length>12?'compact':''}">${cards.map(c=>{const legal=S.id==='huit'&&mine&&eightLegal(S,c),selectable=mine&&['president','menteur'].includes(S.id)&&(S.id!=='menteur'||S.phase==='play'),isButton=legal||selectable;return cardHTML(c,{button:isButton,classes:(legal?'legal pickable ':selectable?'pickable ':'')+(selection.has(c.id)?'selected ':'')+(S.id==='huit'&&mine&&!legal?'dim':''),selected:selectable?selection.has(c.id):undefined,attr:`data-action="hand-card" data-id="${c.id}"`,key:'c-'+c.id});}).join('')||'<span class="empty-hand">Plus une carte. Profitez du spectacle.</span>'}</div>`}<p class="hand-help">${helper}</p></section>`;
}
function collectRects(){let m=new Map();document.querySelectorAll('[data-flip]').forEach(el=>{if(!m.has(el.dataset.flip)){const r=el.getBoundingClientRect();m.set(el.dataset.flip,{left:r.left,top:r.top,width:r.width,height:r.height,back:el.classList.contains('back')});}});return m;}
function renderGame(animate=true,path=null){if(!S||view!=='game')return;const old=animate&&motions()?collectRects():new Map(),focus=document.activeElement,focusAction=focus?.dataset?.action,focusId=focus?.dataset?.id,openLog=!!document.querySelector('.log-panel[open]');$('app').innerHTML=gameHTML();if(openLog)document.querySelector('.log-panel')?.setAttribute('open','');document.title=GAMES[S.id].name+' — La table de jeux';if(focusAction){const matches=[...document.querySelectorAll('[data-action]')].filter(el=>el.dataset.action===focusAction&&(!focusId||el.dataset.id===focusId)&&!el.disabled);matches[0]?.focus({preventScroll:true});}if(animate&&motions()&&!gate){let index=0;document.querySelectorAll('[data-flip]').forEach(el=>{const key=el.dataset.flip;if(path&&key==='pawn-'+S.movedPlayer)return;const before=old.get(key),now=el.getBoundingClientRect();if(before&&before.back!==el.classList.contains('back')){el.animate([{transform:'perspective(600px) rotateY(90deg)',opacity:.3},{transform:'perspective(600px) rotateY(0)',opacity:1}],{duration:460,easing:'cubic-bezier(.2,.7,.2,1)'});}else if(before){const dx=before.left-now.left,dy=before.top-now.top;if(Math.abs(dx)+Math.abs(dy)>3&&Math.abs(dy)<1300)el.animate([{transform:`translate(${dx}px,${dy}px) scale(${before.width/now.width})`},{transform:'translate(0,0) scale(1)'}],{duration:420,easing:'cubic-bezier(.2,.7,.2,1)'});}else if(key.startsWith('c-')||key.startsWith('t-')||key.startsWith('cactus-')||key.startsWith('dealer-')){el.animate([{opacity:0,transform:'translate(35px,-25px) rotate(10deg) scale(.82)'},{opacity:1,transform:'translate(0,0) rotate(0) scale(1)'}],{duration:330,delay:Math.min(index++*24,400),fill:'backwards',easing:'cubic-bezier(.2,.7,.2,1)'});}});if(path)animatePawn(path,old);}}
function animatePawn(path,old){const pawn=document.querySelector(`[data-flip="pawn-${S.movedPlayer}"]`);if(!pawn||!path.length)return;const end=pawn.getBoundingClientRect(),start=old.get('pawn-'+S.movedPlayer),frames=[];if(start)frames.push({transform:`translate(${start.left-end.left}px,${start.top-end.top}px)`});path.slice(1).forEach((n,k)=>{const el=document.querySelector(`[data-cell="${n}"]`)||(n===0?document.querySelector('.start-tokens'):null);if(!el)return;const r=el.getBoundingClientRect();frames.push({transform:`translate(${r.left+r.width/2-end.left-end.width/2}px,${r.top+r.height/2-end.top-end.height/2}px)`});el.animate([{filter:'brightness(1.5)'},{filter:'brightness(1)'}],{duration:280,delay:k*55});});frames.push({transform:'translate(0,0)'});pawn.animate(frames,{duration:Math.min(1500,Math.max(430,frames.length*65)),easing:'linear'});}
function celebrate(){sound('win');if(!motions())return;for(let i=0;i<50;i++){const el=document.createElement('i');el.className='confetti';el.style.cssText=`--left:${Math.random()*100}vw;--color:${COLORS[i%6]};--dur:${2.2+Math.random()*1.9}s;--delay:${Math.random()*.6}s;--drift:${Math.random()*220-110}px`;document.body.append(el);setTimeout(()=>el.remove(),5000);}}
function schedule(){clearTimeout(timer);timer=null;if(!S||view!=='game'||gate||busy||$('dialog').open||document.hidden||S.phase==='over'||S.phase==='roundEnd')return;if(S.phase==='dealer'||player(S).bot){timer=setTimeout(()=>{if(!S||view!=='game'||$('dialog').open||gate||document.hidden)return;dispatch(ai(S),true);},S.id==='oie'&&motions()?Math.max(prefs.fast?260:900,Math.min(1500,(S.path?.length||0)*65+100)):prefs.fast?260:900);}}
function dispatch(a,automatic=false){if(!S||view!=='game'||gate||busy||$('dialog').open)return;if(!automatic&&!canPlay()&&!(S.phase==='roundEnd'&&a.type==='nextRound'))return;if(S.id==='oie'&&a.type==='roll'&&!a.dice&&!player(S).wait&&motions()){busy=true;renderGame(false);sound('dice');timer=setTimeout(()=>{busy=false;dispatch({...a,dice:[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]},automatic);},prefs.fast?300:650);return;}
 const previous=clone(S),previousTurn=S.turn,previousPhase=S.phase;let ok=false;try{ok=act(S,a);}catch(error){S=previous;toast('Ce coup n’a pas pu être joué. Votre partie est conservée.');console.error(error);renderGame(false);schedule();return;}if(!ok){S=previous;if(a.type==='suggest')toast('Aucun coup simple trouvé. Essayez une autre combinaison ou piochez.');else if(a.type==='commit')toast(rummiDiagnostic(S).text);else toast('Ce coup n’est pas possible à ce moment de la partie.');sound('error');renderGame(false);schedule();return;}
 selection.clear();showSuit=null;const changed=previousTurn!==S.turn||S.id==='vingtetun'&&previousPhase==='roundEnd'&&S.phase==='bet';if(S.mode==='local'&&S.id!=='oie'&&changed&&S.phase!=='over'&&S.phase!=='roundEnd'&&S.phase!=='dealer')gate=true;record();save();renderGame(true,S.id==='oie'&&a.type==='roll'?S.path:null);$('announcer').textContent=S.message+' '+turnText()[0];if(S.phase==='over'&&previousPhase!=='over'){celebrate();document.querySelector('.win-box')?.scrollIntoView({behavior:motions()?'smooth':'auto',block:'start'});}else sound(a.type==='roll'?'dice':'card');schedule();}
function updateActionZone(){renderGame(false);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;if(action==='home'){save();showHome();return;}if(action==='setup'){openSetup(el.dataset.id);return;}if(action==='random'){openSetup(Object.keys(GAMES)[Math.floor(Math.random()*8)]);return;}if(action==='filter'){filter=el.dataset.filter;document.querySelectorAll('.filter').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',b.dataset.filter===filter);});$('games-grid').innerHTML=gameCardsHTML();return;}if(action==='close-modal'){closeModal();return;}if(action==='settings'){openSettings();return;}if(action==='sound'){prefs.sound=!prefs.sound;applyPrefs();sound();document.querySelectorAll('[data-action="sound"]').forEach(b=>{b.innerHTML=icon(prefs.sound?'sound':'mute');b.setAttribute('aria-label',(prefs.sound?'Couper':'Activer')+' le son');b.setAttribute('aria-pressed',prefs.sound);});return;}if(action==='mode'){setupNames();setup.mode=el.dataset.mode;setup.names=[];renderSetup();return;}if(action==='resume'){S=clone(saved);view='game';selection.clear();showSuit=null;busy=false;gate=S.mode==='local'&&S.id!=='oie'&&!['over','dealer','roundEnd'].includes(S.phase);renderGame(false);window.scrollTo(0,0);schedule();return;}if(action==='rules'){openRules();return;}if(action==='pause'){save();modal(`<div class="eyebrow">PRENEZ VOTRE TEMPS</div><h2>La table vous attend.</h2><p class="modal-subtitle">La partie est en pause. Vos cartes seront là à votre retour.</p><button class="btn full" data-action="close-modal">Reprendre la partie ${icon('play')}</button><button class="btn ghost full" style="margin-top:12px" data-action="home">Retour aux jeux</button>`,'pause');return;}if(action==='reveal-hand'){gate=false;renderGame(true);sound();schedule();return;}if(action==='replay'){startGame(S.config,S.id,S);return;}if(action==='sort'){sortByColor=!sortByColor;renderGame(true);return;}if(action==='clear-selection'){selection.clear();updateActionZone();return;}if(action==='cancel-suit'){showSuit=null;renderGame(false);return;}if(action==='choose-suit'){dispatch({type:'card',id:showSuit,suit:el.dataset.suit});return;}if(action==='game'){dispatch(JSON.parse(el.dataset.gameact));return;}
 if(action==='hand-card'){if(!canPlay())return;const c=player(S).hand.find(c=>c.id===el.dataset.id);if(!c)return;if(S.id==='huit'){if(c.rank===8){showSuit=c.id;renderGame(false);}else dispatch({type:'card',id:c.id});}else if(['president','menteur'].includes(S.id)){if(selection.has(c.id))selection.delete(c.id);else if(selection.size<4)selection.add(c.id);else toast('Quatre cartes au maximum.');renderGame(false);}return;}
 if(action==='select-tile'){if(!canPlay())return;const id=el.dataset.id;if(selection.has(id))selection.delete(id);else selection.add(id);renderGame(false);return;}
 if(action==='rummi-place'){if(!selection.size)return;const dest=['new','hand'].includes(el.dataset.dest)?el.dataset.dest:Number(el.dataset.dest);dispatch({type:'move',ids:[...selection],dest});}
});
document.addEventListener('input',e=>{if(e.target.id==='search-games'){query=e.target.value;$('games-grid').innerHTML=gameCardsHTML();}});
document.addEventListener('change',e=>{if(e.target.id==='player-count'){setupNames();setup.count=Number(e.target.value);renderSetup();}if(e.target.id.startsWith('pref-')){const key=e.target.id.slice(5);prefs[key]=e.target.checked;applyPrefs();if(key==='sound')sound();}});
document.addEventListener('submit',e=>{if(e.target.id==='setup-form'){e.preventDefault();setupNames();const names=Array.from({length:setup.count},(_,i)=>setup.mode==='solo'&&i>0?BOT_NAMES[i-1]:setup.names[i]?.trim()||'Joueur '+(i+1));startGame({mode:setup.mode,names},setup.id);}if(e.target.id==='bet-form'){e.preventDefault();dispatch({type:'bet',amount:Number($('bet-amount').value)});}});
$('dialog').addEventListener('cancel',()=>{setTimeout(()=>{modalKind='';schedule();},0);});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);if(busy){busy=false;renderGame(false);}save();}else schedule();});
window.addEventListener('pagehide',save);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dialog').open&&view==='game'&&!gate){if(showSuit){showSuit=null;renderGame(false);}else if(selection.size){selection.clear();renderGame(false);}else{clearTimeout(timer);save();modal('<div class="eyebrow">PAUSE</div><h2>Une petite pause.</h2><p class="modal-subtitle">La partie est sauvegardée.</p><button class="btn full" data-action="close-modal">Reprendre la partie</button>','pause');}}});
applyPrefs();showHome();
</script></body></html>
