<!doctype html><html data-area="leximind" lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LexiMind — Le Salon</title><style>
:root{color-scheme:dark;--b:#090b10;--p:#141925;--t:#f7f8fb;--m:#9ba6b8;--l:#293142;--a:#a7b8ff;--g:#65dfad;--r:#ff7d8b;--y:#ffd36c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26315a,#090b10 48%);color:var(--t);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}.w{max-width:1080px;margin:auto;padding:22px 16px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{font-size:25px;font-weight:900}.brand i{font-style:normal;color:var(--a)}a{color:inherit;text-decoration:none}.back{border:1px solid var(--l);padding:9px 13px;border-radius:10px;color:var(--m)}nav{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.nav{border:1px solid var(--l);background:#ffffff08;color:white;border-radius:11px;padding:10px 14px;white-space:nowrap}.nav.on{background:var(--a);color:#11172a;font-weight:800}.card{background:linear-gradient(145deg,#161b27,#10131b);border:1px solid var(--l);border-radius:22px;padding:clamp(20px,4vw,32px)}.hide{display:none!important}.tag{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--a);font-weight:800}.word{font-size:clamp(45px,8vw,78px);letter-spacing:-3px;margin:5px 0}.muted{color:var(--m)}.def{font:23px/1.5 Georgia;margin-top:20px;max-width:820px}.ex{border-left:2px solid var(--a);padding-left:14px;margin-top:18px;color:#ccd3e0}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--a);color:#101526;font-weight:800}.btn.alt{background:#ffffff08;color:white;border:1px solid var(--l)}.btn.good{background:var(--g)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:7px 11px;border:1px solid var(--l);border-radius:99px;color:var(--m)}.chip b{color:white}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{padding:15px;min-height:88px;text-align:left;border:1px solid var(--l);border-radius:13px;background:#ffffff07;color:white}.ans.ok{border-color:var(--g)}.ans.no{border-color:var(--r)}textarea{width:100%;min-height:130px;background:#0b0e14;color:white;border:1px solid var(--l);border-radius:12px;padding:13px}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;border:1px solid var(--l);border-radius:14px}.metric b{display:block;font-size:28px}.list{margin-top:18px;display:grid;gap:7px}.item{display:flex;justify-content:space-between;padding:11px;border:1px solid var(--l);border-radius:10px}@media(max-width:700px){.answers,.metricgrid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./shared/puff-widget.css?v=5"></head><body><div class="w"><header><div class="brand">Lexi<i>Mind</i></div><a class="back" href="./index.html">← Le Salon</a></header><div class="stats"><span class="chip">Session continue <b id="sessionCount">0</b> mots vus</span><span class="chip">Appris <b id="learned">0</b></span><span class="chip">À revoir <b id="due">0</b></span><span class="chip">Série <b id="streak">0</b> 🔥</span><span class="chip">XP <b id="xp">0</b></span></div><nav><button class="nav on" data-p="discover">Découvrir</button><button class="nav" data-p="quiz">Quiz</button><button class="nav" data-p="free">Réponse libre</button><button class="nav" data-p="review">Révisions</button><button class="nav" data-p="progress">Progression</button></nav>
<section class="page card" id="discover"><div class="tag">Nouveau mot</div><h1 class="word" id="w"></h1><div class="muted" id="pos"></div><div class="def" id="def"></div><div class="ex" id="ex"></div><div class="row"><button class="btn good" id="learn">+ Apprendre</button><button class="btn alt" id="known">Je connais déjà</button><button class="btn alt" id="next">Autre mot ↻</button></div></section>
<section class="page card hide" id="quiz"><div class="tag">Quiz adaptatif</div><h2 id="qword"></h2><div class="answers" id="answers"></div><div class="row"><button class="btn alt hide" id="qnext">Question suivante →</button></div></section>
<section class="page card hide" id="free"><div class="tag">Rappel actif</div><h2 id="fword"></h2><p class="muted">Explique le sens avec tes propres mots.</p><textarea id="freeText"></textarea><div class="row"><button class="btn" id="check">Évaluer</button><button class="btn alt" id="fnext">Changer</button></div><div id="feedback" class="ex hide"></div></section>
<section class="page card hide" id="review"><div class="tag">Répétition espacée</div><h2>À réviser aujourd'hui</h2><div id="reviewArea"></div></section>
<section class="page card hide" id="progress"><div class="tag">Progression locale</div><h2>Ta mémoire lexicale</h2><div class="metricgrid"><div class="metric"><b id="m1">0</b>Mots vus</div><div class="metric"><b id="m2">0%</b>Réussite</div><div class="metric"><b id="m3">0</b>Maîtrisés</div><div class="metric"><b id="m4">0</b>Meilleure série</div></div><div class="row"><button class="btn alt" id="export">Exporter ma progression</button></div><div class="list" id="plist"></div></section></div><script>
const D=[];
const K="salon_leximind_v1";let SESSION={words:[],index:0,goal:20,seed:Date.now()};let S=JSON.parse(localStorage.getItem(K)||"null")||{words:{},answers:0,correct:0,streak:0,best:0,xp:0},cur,A,Q,locked=false;const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function rec(w){return S.words[w]||(S.words[w]={level:0,next:0,correct:0,wrong:0,known:false})}function save(){localStorage.setItem(K,JSON.stringify(S));stats()}function stats(){$("learned").textContent=Object.keys(S.words).length;$("due").textContent=D.filter(x=>S.words[x.word]&&!S.words[x.word].known&&S.words[x.word].next<=Date.now()).length;$("streak").textContent=S.streak;$("xp").textContent=S.xp}function schedule(w,ok,rating){let r=rec(w),n=LexiAdaptive.next({level:r.level,stability:r.stability,difficulty:r.difficulty,reviews:r.reviews,lapses:r.wrong,due_at:r.due_at||new Date(r.next||0).toISOString()},rating??(ok?2:0));Object.assign(r,n);r.next=new Date(n.due_at).getTime();ok?r.correct++:r.wrong++;cloudWord(w,r,rating??(ok?2:0))}
async function cloudWord(w,r,rating){let db=SalonAccount.db?.(),u=SalonAccount.user?.();if(!db||!u)return;let q=await db.from("lexicon").select("id").eq("word",w).limit(1).maybeSingle();if(!q.data)return;SalonCloud.saveProgress([{word_id:q.data.id,level:r.level,stability:r.stability,difficulty:r.difficulty,due_at:r.due_at,reviews:r.reviews,lapses:r.wrong,known:r.known||false,favorite:r.favorite||false,last_rating:rating}]);SalonCloud.review({word_id:q.data.id,exercise:"leximind",rating:rating,response_ms:0})}function fresh(){let a=D.filter(x=>!S.words[x.word]);cur=pick(a.length?a:D);if(!cur){$("w").textContent="Connexion…";$("pos").textContent="";$("def").textContent="Chargement du lexique serveur";$("ex").textContent="";return}$("w").textContent=cur.word;$("pos").textContent=cur.pos;$("def").textContent=cur.definition;$("ex").textContent=cur.example?"« "+cur.example+" »":""}$("next").onclick=()=>{SESSION.index=Math.min(SESSION.goal,SESSION.index+1);$("sessionCount").textContent=SESSION.index+" / "+SESSION.goal;fresh()};$("learn").onclick=()=>{rec(cur.word).next=Date.now();S.xp+=5;save();fresh()};$("known").onclick=()=>{let r=rec(cur.word);r.known=true;r.level=6;r.next=Date.now()+60*864e5;save();fresh()};
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".page").forEach(x=>x.classList.add("hide"));$(b.dataset.p).classList.remove("hide");if(b.dataset.p==="quiz")newQuiz();if(b.dataset.p==="free")newFree();if(b.dataset.p==="review")review();if(b.dataset.p==="progress")progress()});
function pool(){let a=D.filter(x=>S.words[x.word]&&!S.words[x.word].known);return a.length>=4?a:D}async function newQuiz(){let qp=await LexiFeed.quiz(12);Q=pick(qp.length?qp:pool());locked=false;$("qword").textContent=Q.word;$("qnext").classList.add("hide");let server=await LexiExercises.mcq(Q),o=server?server.options:[Q,...D.filter(x=>x!==Q).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$("answers").innerHTML="";o.forEach(x=>{let b=document.createElement("button");b.className="ans";b.textContent=x.definition;b.onclick=()=>{if(locked)return;locked=true;let ok=server?x.is_answer:x===Q;b.classList.add(ok?"ok":"no");if(!ok)[...$("answers").children].find(z=>z.textContent===(server?server.target.definition:Q.definition))?.classList.add("ok");S.answers++;if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=10}else S.streak=0;schedule(Q.word,ok);save();$("qnext").classList.remove("hide")};$("answers").appendChild(b)})}$("qnext").onclick=newQuiz;
async function newFree(){let qp=await LexiFeed.quiz(12);A=pick(qp.length?qp:pool());$("fword").textContent=A.word;$("freeText").value="";$("feedback").classList.add("hide")}$("fnext").onclick=newFree;$("check").onclick=async()=>{let ev=await LexiEvaluator.evaluate(A,$("freeText").value),ok=ev.ok;S.answers++;if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=ev.score===2?12:6}else S.streak=0;schedule(A.word,ok,ev.score===2?2:ev.score===1?1:0);save();$("feedback").classList.remove("hide");$("feedback").innerHTML=(ok?"✓ "+ev.feedback:ev.feedback)+"<br><span class=muted>"+(ev.reference||A.definition)+"</span>"};
async function review(){let sr=await LexiExercises.review();if(sr){D.splice(0,D.length,sr);let d=[sr];return renderReview(d)}let d=D.filter(x=>S.words[x.word]&&!S.words[x.word].known&&S.words[x.word].next<=Date.now()),z=$("reviewArea");if(!d.length){z.innerHTML="<p class=muted>Aucune révision urgente. Continue à découvrir des mots.</p>";return}return renderReview(d)}function renderReview(d){let z=$("reviewArea"),x=pick(d);z.innerHTML='<h2>'+x.word+'</h2><button class="btn alt" id="reveal">Révéler</button><div id="rd" class="hide"><div class="def">'+x.definition+'</div><div class="row"><button class="btn alt" id="again">Encore</button><button class="btn alt" id="hard">Difficile</button><button class="btn good" id="good">Bien</button><button class="btn good" id="easy">Facile</button></div></div>';$("reveal").onclick=()=>{$("reveal").classList.add("hide");$("rd").classList.remove("hide")};$("again").onclick=()=>{schedule(x.word,false,0);save();review()};$("hard").onclick=()=>{schedule(x.word,true,1);S.xp+=5;save();review()};$("good").onclick=()=>{schedule(x.word,true,2);S.xp+=10;save();review()};$("easy").onclick=()=>{schedule(x.word,true,3);S.xp+=14;save();review()}}
function progress(){$("m1").textContent=Object.keys(S.words).length;$("m2").textContent=S.answers?Math.round(S.correct/S.answers*100)+"%":"0%";$("m3").textContent=Object.values(S.words).filter(x=>x.level>=4||x.known).length;$("m4").textContent=S.best;$("plist").innerHTML=Object.entries(S.words).map(([w,r])=>'<div class=item><b>'+w+'</b><span>Niv. '+r.level+'/6 · '+r.correct+' ✓ · '+r.wrong+' ✕</span></div>').join("")}$("export").onclick=()=>{let b=new Blob([JSON.stringify({app:"LexiMind",state:S},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="leximind-progression.json";a.click()};async function hydrateServerLexicon(){try{await LexiFeed.refill();let first=await LexiFeed.next();if(first){D.splice(0,D.length,first);cur=first;$("w").textContent=cur.word;$("pos").textContent=cur.pos;$("def").textContent=cur.definition;$("ex").textContent="« "+cur.example+" »";document.querySelector("#discover .tag").textContent="Nouveau mot · flux serveur"}}catch(e){}}
async function infiniteNext(){let x=await LexiFeed.next();if(!x){LexiOffline.show();return fresh()}LexiOffline.hide();SESSION.index++;$("sessionCount").textContent=SESSION.index;D.splice(0,D.length,x);cur=x;$("w").textContent=x.word;$("pos").textContent=x.pos;$("def").textContent=x.definition;$("ex").textContent=x.example?"« "+x.example+" »":""}
$("next").onclick=infiniteNext;SalonAccount.onChange(()=>{LexiFeed.reset();hydrateServerLexicon()});window.addEventListener("lexi:retry",()=>{LexiFeed.reset();hydrateServerLexicon()});setTimeout(hydrateServerLexicon,0);fresh();stats();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./shared/config.js"></script><script src="./shared/account.js"></script><script src="./shared/account-ui.js"></script><script src="./shared/profile.js"></script><script src="./shared/profile-ui.js"></script><script src="./shared/usage-tracker.js"></script><script src="./shared/user-stats.js"></script><script src="./shared/lexi-sync.js"></script><script src="./shared/cloud-data.js"></script><script src="./shared/lexi-adaptive.js"></script><script src="./shared/lexicon-api.js"></script><script src="./shared/lexi-feed.js"></script><script src="./shared/lexi-exercises.js"></script><script src="./shared/lexi-evaluator.js"></script><script src="./shared/lexi-offline.js"></script><script src="./shared/lexi-library.js"></script><script src="./shared/lexi-dashboard-ui.js"></script><script src="./shared/puff-widget.js?v=5"></script></body></html>
